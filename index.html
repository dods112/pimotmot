<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Monthsary, Love!</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; overflow: hidden; background: #4a1010; color: #f5e6c8;
    font-family: "Cormorant Garamond", Georgia, serif;
  }
  .script { font-family: "Great Vibes", cursive; font-weight: 400; }
  .screen {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 2rem;
    animation: fade .8s ease;
  }
  .screen.active { display: flex; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .cover-title { font-size: clamp(2.6rem, 8vw, 4.8rem); margin-bottom: 2.5rem; line-height: 1.1; }
  .envelope {
    position: relative; width: min(72vw, 340px); aspect-ratio: 1.5;
    background: #f3e3c3; border-radius: 4px; cursor: pointer;
    box-shadow: 0 14px 30px rgba(0,0,0,.4);
  }
  .flap {
    position: absolute; top: 0; left: 0; right: 0; height: 58%;
    background: #e6cf9f; clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center; transition: transform .8s ease; z-index: 2;
  }
  .envelope.open .flap { transform: rotateX(180deg); }
  .seal {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
    width: 56px; height: 56px; border-radius: 50%; background: #9b1b2a; color: #f5e6c8;
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem; z-index: 3;
  }
  .tap { margin-top: 1.8rem; font-family: "Great Vibes", cursive; font-size: 1.6rem; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

  .menu-title { font-size: clamp(2.6rem, 8vw, 4rem); margin-bottom: 2.5rem; }
  .menu-items { display: flex; gap: clamp(1.5rem, 6vw, 4rem); flex-wrap: wrap; justify-content: center; }
  .item {
    background: none; border: none; color: #f5e6c8; cursor: pointer; font-family: inherit;
    font-size: 1.25rem; font-style: italic; display: flex; flex-direction: column;
    align-items: center; gap: .6rem; transition: transform .2s ease; text-decoration: none;
  }
  .item:hover { transform: translateY(-4px); }
  .item .icon { font-size: 4rem; line-height: 1; }

  .back {
    position: absolute; top: 1.2rem; left: 1.2rem; background: none; border: none;
    color: #f5e6c8; font-family: inherit; font-style: italic; font-size: 1.1rem; cursor: pointer;
  }
  .page-title { font-size: clamp(2.4rem, 7vw, 3.6rem); margin-bottom: 1.5rem; }
  .parchment {
    width: min(92vw, 520px); background: #fbeeca; color: #4a1010;
    padding: 2.5rem 2rem; border-radius: 6px; box-shadow: 0 14px 30px rgba(0,0,0,.4); text-align: left;
  }
  #typed { font-size: 1.25rem; line-height: 1.7; white-space: pre-wrap; min-height: 14rem; }
  .cursor { display: inline-block; width: 2px; height: 1.1em; background: #4a1010; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .song-box { width: min(92vw, 560px); }
  .song-box iframe { width: 100%; aspect-ratio: 16 / 9; border: none; border-radius: 10px; }
  .song-note { font-style: italic; opacity: .8; margin-top: 1rem; }
</style>
</head>
<body>

<section class="screen active" id="cover">
  <h1 class="cover-title script">Happy Monthsary, Love!</h1>
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>
  <div class="tap">Tap to open!</div>
</section>

<section class="screen" id="menu">
  <h2 class="menu-title script">For you</h2>
  <div class="menu-items">
    <button class="item" data-go="letter"><span class="icon">✉️</span>Letter</button>
    <a class="item" href="flower.html"><span class="icon">💐</span>Flower</a>
    <button class="item" data-go="song"><span class="icon">🧸</span>A song for you</button>
  </div>
</section>

<section class="screen" id="letter">
  <button class="back" data-go="menu">← back</button>
  <div class="parchment"><p id="typed"></p><span class="cursor"></span></div>
</section>

<section class="screen" id="song">
  <button class="back" data-go="menu">← back</button>
  <h2 class="page-title script">A song for you</h2>
  <div class="song-box" id="songBox"></div>
  <p class="song-note">Nahanap Kita — Amiel Sol</p>
</section>

<script>
  // Put your YouTube video ID here (the part after v= in the link)
  var SONG_ID = "";

  // Write your letter here
  var LETTER = [
    "Dear [Name],",
    "",
    "Sa dami ng taong dumaan sa buhay ko, hindi ko akalain na one day, mahahanap kita.",
    "",
    "You came into my life unexpectedly, but somehow you became someone I never want to lose. Another month has passed, and every day with you still feels like the best part of my week.",
    "",
    "Thank you for your patience, your laughter, and for always making me feel at home. I hope our next month is full of little adventures and quiet moments.",
    "",
    "I'm really glad it's you.",
    "",
    "Always yours,",
    "[Your Name]"
  ].join("\n");

  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) {
      s.classList.toggle('active', s.id === id);
    });
    if (id === 'letter') typeLetter();
    if (id === 'song') loadSong();
  }

  document.getElementById('envelope').addEventListener('click', function (e) {
    var env = e.currentTarget;
    if (env.classList.contains('open')) return;
    env.classList.add('open');
    setTimeout(function () { show('menu'); }, 1000);
  });

  document.querySelectorAll('[data-go]').forEach(function (btn) {
    btn.addEventListener('click', function () { show(btn.dataset.go); });
  });

  var typedOnce = false;
  function typeLetter() {
    if (typedOnce) return;
    typedOnce = true;
    var el = document.getElementById('typed');
    var i = 0;
    (function step() {
      el.textContent = LETTER.slice(0, i++);
      if (i <= LETTER.length) setTimeout(step, 35);
    })();
  }

  function loadSong() {
    var box = document.getElementById('songBox');
    if (!SONG_ID) {
      box.innerHTML = '<p class="song-note">Paste your YouTube video ID into SONG_ID in index.html.</p>';
      return;
    }
    if (!box.querySelector('iframe')) {
      box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + SONG_ID + '" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    }
  }
</script>
</body>
</html>
