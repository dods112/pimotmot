<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For my favorite person</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--burg:#3B0710;--wine:#641525;--rose:#C42648;--cream:#FFF0D9;--ivory:#FFF6E8;--blush:#F5B9C5;--gold:#D8B16A}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#641525 0%,var(--burg) 65%,#220308 100%);color:var(--cream);font-family:"Cormorant Garamond",Georgia,serif;min-height:100dvh}
button{font:inherit;cursor:pointer}
.layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#glow{z-index:0;background:radial-gradient(circle at 50% 45%,rgba(196,38,72,.4),transparent 60%);opacity:0;transition:opacity 3s ease}
body.ready #glow{opacity:1}
#garden{z-index:1}
#petals{z-index:2}
#veil{z-index:3;opacity:0;background:radial-gradient(ellipse at center,rgba(59,7,16,.35) 0%,rgba(59,7,16,.12) 55%,rgba(59,7,16,0) 100%);transition:opacity 1.4s ease}
body.bursting #veil,body.revealed #veil{opacity:1}

.flower{position:absolute;pointer-events:none}
.flower img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;transform-origin:50% 60%;filter:saturate(1.35) contrast(1.1);animation:sway var(--dur,7s) ease-in-out var(--delay,0s) infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--rot) - 4deg))}to{transform:rotate(calc(var(--rot) + 4deg)) translateY(-5px)}}
.petal{position:absolute;top:-60px;width:30px;height:auto;animation:fall linear infinite;opacity:.9}
@keyframes fall{from{transform:translate(0,-8vh) rotate(0deg)}to{transform:translate(28vw,118vh) rotate(540deg)}}
.bp{position:absolute;width:46px;height:46px;object-fit:contain;pointer-events:none}

/* Gift opening screen */
#giftScene{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:1rem;transition:opacity 1.2s ease}
#giftScene.gone{opacity:0;pointer-events:none}
#giftGreet{font-family:"Great Vibes",cursive;font-size:clamp(1.8rem,6vw,2.8rem);text-align:center;color:var(--ivory);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.gift{position:relative;width:min(44vw,180px);height:min(40vw,160px);background:none;border:0;cursor:pointer;animation:float 3.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.gift .base{position:absolute;left:0;bottom:0;width:100%;height:66%;background:linear-gradient(90deg,#a81f3a,#e0506f 50%,#a81f3a);border-radius:5px;box-shadow:0 14px 28px rgba(0,0,0,.45);transition:transform .8s ease}
.gift .lid{position:absolute;left:-5%;top:20%;width:110%;height:24%;background:linear-gradient(90deg,#c52d4d,#f4758f 50%,#c52d4d);border-radius:5px;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform 1s cubic-bezier(.3,1.5,.5,1),opacity .9s ease}
.rib{position:absolute;top:0;bottom:0;left:50%;width:14%;transform:translateX(-50%);background:#ffe3ea}
.gift .bow{position:absolute;top:-30%;left:50%;width:46%;height:52%;transform:translateX(-50%);transition:opacity .4s}
.bow span{position:absolute;top:0;width:50%;height:100%;border:7px solid #ffe3ea;border-radius:50%}
.bow span:first-child{left:0;transform:rotate(-30deg)}
.bow span:last-child{right:0;transform:rotate(30deg)}
.gift.open .lid{transform:translateY(-130px) rotate(-22deg);opacity:0}
.gift.open .base{transform:scale(.94)}
.gift.open .bow{opacity:0}
.gift:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
#hint{font-size:1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blush);animation:blink 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}

/* Hero */
#hero{position:fixed;inset:0;z-index:5;overflow-y:auto;padding:1.2rem;visibility:hidden;pointer-events:none}
body.revealed #hero{visibility:visible;pointer-events:auto}
#heroInner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;text-align:center}
.rv{opacity:0;transform:translateY(16px);transition:opacity 1.4s ease var(--d,0s),transform 1.4s ease var(--d,0s)}
body.revealed .rv{opacity:1;transform:none}
.kicker{font-size:clamp(.8rem,2.2vw,1rem);letter-spacing:.3em;text-transform:uppercase;color:var(--blush)}
.heading{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.6rem,9vw,5.2rem);line-height:1.05;color:var(--ivory);text-shadow:0 0 18px rgba(245,185,197,.45),0 2px 14px rgba(0,0,0,.5)}
.card{position:relative;background:linear-gradient(160deg,#fff7e8,#f5e4c6);color:#4a1420;width:min(90vw,440px);padding:1.5rem 1.6rem 1.8rem;border-radius:6px 6px 10px 10px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.card .for{font-style:italic;font-size:1.1rem;margin-bottom:.4rem}
.card .msg{font-size:1.2rem;line-height:1.6}
.seal{position:absolute;right:14px;bottom:-14px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e0506f,#8a1630);color:var(--ivory);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.quote{font-family:"Great Vibes",cursive;font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.35;max-width:600px;color:var(--ivory);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.btns{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:.4rem}
.btn{color:#fff;background:var(--rose);border:0;padding:.7rem 1.5rem;border-radius:999px;font-style:italic;font-size:1.1rem;box-shadow:0 8px 18px rgba(0,0,0,.35);transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--ivory)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#musicBtn{position:fixed;top:1rem;right:1rem;z-index:40;background:rgba(59,7,16,.6);color:var(--ivory);border:1px solid var(--gold);padding:.4rem .9rem;border-radius:999px;font-style:italic;font-size:.95rem}

.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(40,4,12,.62);padding:1rem}
.overlay.show{display:flex}
.sheet{position:relative;background:linear-gradient(#fff7e8,#f7e7cc);color:#3e1220;width:min(92vw,560px);max-height:86dvh;overflow-y:auto;padding:2.2rem 1.8rem;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:unfold .9s ease both}
@keyframes unfold{from{opacity:0;transform:translateY(30px) rotate(-1deg)}to{opacity:1;transform:none}}
.sheet .from{font-style:italic;font-size:1.05rem}
.sheet .to{font-family:"Great Vibes",cursive;font-size:2.2rem;margin:.4rem 0 .8rem}
.letter-text{white-space:pre-wrap;font-size:1.15rem;line-height:1.75;min-height:8rem}
.close{position:absolute;top:.4rem;right:.7rem;background:none;border:0;font-size:2rem;color:#7a2a3a;line-height:1}
.close:focus-visible{outline:2px solid var(--rose)}

/* Our memories */
#gardenView .gbox{width:min(94vw,760px);max-height:92dvh;overflow-y:auto;text-align:center;color:var(--ivory);position:relative;padding:1rem}
.gtitle{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.2rem,7vw,3.4rem);color:var(--ivory)}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.7rem,2vw,1.2rem);margin:1rem auto;max-width:700px}
@media (min-width:700px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mem{background:#fff7e8;border:0;padding:.6rem .6rem 1.4rem;border-radius:4px;box-shadow:0 8px 18px rgba(0,0,0,.4);transform:rotate(var(--tilt,0deg));transition:transform .25s ease}
.mem:nth-child(3n+2){--tilt:2deg}
.mem:nth-child(3n+3){--tilt:-2deg}
.mem:hover{transform:rotate(0deg) translateY(-3px)}
.mem:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.mem .frame{width:100%;aspect-ratio:3/4;background:#f3d6dc;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mem img{width:100%;height:100%;object-fit:cover;display:block}
.mem .frame.fallback img{object-fit:contain;padding:12%;filter:saturate(1.3)}
.mem .cap{display:block;margin-top:.5rem;font-style:italic;font-size:1rem;color:#4a1420;text-align:center}
#gardenView.open .mem{animation:bloomIn .9s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0s)}
@keyframes bloomIn{from{opacity:0;transform:scale(.6) rotate(var(--tilt,0deg))}to{opacity:1;transform:scale(1) rotate(var(--tilt,0deg))}}
.mnote{min-height:4.5em;font-size:1.25rem;font-style:italic;color:var(--blush);padding:.6rem 1rem;line-height:1.5}
.mnote strong{display:block;font-family:"Great Vibes",cursive;font-style:normal;font-weight:400;font-size:1.8rem;color:var(--ivory);margin-bottom:.2rem}
.gback{margin-top:.6rem}

@media (prefers-reduced-motion: reduce){
  .flower img,.petal,.gift,#hint,.mem{animation:none !important}
  .rv{transition:none}
}
</style>
</head>
<body>

<div id="glow" class="layer"></div>
<div id="garden" class="layer"></div>
<div id="petals" class="layer"></div>
<div id="veil" class="layer"></div>

<section id="giftScene">
  <p id="giftGreet"></p>
  <button id="gift" class="gift" aria-label="Open your gift">
    <div class="lid"><div class="rib"></div></div>
    <div class="base"><div class="rib"></div></div>
    <div class="bow"><span></span><span></span></div>
  </button>
  <p id="hint">Tap the gift</p>
</section>

<section id="hero">
  <div id="heroInner">
    <p class="kicker rv" style="--d:0s" id="kicker"></p>
    <h1 class="heading rv" style="--d:.5s" id="heading"></h1>
    <div class="card rv" style="--d:1.1s">
      <p class="for" id="forLine"></p>
      <p class="msg" id="cardMsg"></p>
      <span class="seal">♥</span>
    </div>
    <p class="quote rv" style="--d:1.8s" id="quote"></p>
    <div class="btns rv" style="--d:2.2s">
      <button class="btn" id="btnLetter">Read my letter</button>
      <button class="btn ghost" id="btnGarden">Our garden</button>
      <button class="btn ghost" id="btnReplay">Replay</button>
    </div>
  </div>
</section>

<button id="musicBtn" hidden>Play music</button>
<audio id="bgm" loop preload="none"></audio>

<div id="letter" class="overlay" role="dialog" aria-modal="true" aria-labelledby="fromLine">
  <div class="sheet">
    <button class="close" id="closeLetter" aria-label="Close letter">×</button>
    <p class="from" id="fromLine"></p>
    <p class="to" id="toLine"></p>
    <div class="letter-text" id="letterBody"></div>
    <p class="from" id="letterDate" style="margin-top:1rem"></p>
  </div>
</div>

<div id="gardenView" class="overlay" role="dialog" aria-modal="true" aria-label="Our memories">
  <div class="gbox">
    <h2 class="gtitle">Our memories</h2>
    <div class="mgrid" id="mGrid"></div>
    <p class="mnote" id="mNote">Tap a memory to read it.</p>
    <button class="btn ghost gback" id="gBack">← Back to greeting</button>
  </div>
</div>

<script>
// ===== EDIT YOUR PERSONAL CONTENT HERE =====
const CONFIG = {
  myName: "[MY NAME]",
  herName: "[HER NAME]",
  monthsaryDate: "[OUR MONTHSARY DATE]",
  monthsCount: "[NUMBER] months",
  giftGreeting: "For my favorite person...",
  greeting: "My Favorite Person",
  cardMessage: "[A short personal message about why she is special to you.]",
  quote: "Every day with you is another flower in our little garden.",
  letter: [
    "[Paragraph 1: how you feel about her and this month together.]",
    "[Paragraph 2: a favorite memory you share.]",
    "[Paragraph 3: what you look forward to.]"
  ],
  // Our memories: add your photo path (e.g. "memories/1.jpg") or leave "" to show a flower instead
  memories: [
    { photo: "", title: "[Memory 1 title]", text: "[Describe this memory in a sentence or two.]" },
    { photo: "", title: "[Memory 2 title]", text: "[Describe this memory in a sentence or two.]" },
    { photo: "", title: "[Memory 3 title]", text: "[Describe this memory in a sentence or two.]" },
    { photo: "", title: "[Memory 4 title]", text: "[Describe this memory in a sentence or two.]" },
    { photo: "", title: "[Memory 5 title]", text: "[Describe this memory in a sentence or two.]" },
    { photo: "", title: "[Memory 6 title]", text: "[Describe this memory in a sentence or two.]" }
  ],
  music: "music/song.mp3"   // put your file in a music folder, or set to "" to hide the button
};

// Flower images saved in the flowers folder
const FLOWER_FILES = [
  "flowers/flower1.webp", "flowers/flower2.webp", "flowers/flower3.webp",
  "flowers/flower4.webp", "flowers/flower5.webp", "flowers/flower6.webp"
];

// ===== Helpers =====
const $ = id => document.getElementById(id);
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const garden = $('garden'), petalBox = $('petals');
let sprites = [], wraps = [], timers = [], revealed = false, opened = false, typeTimer = null;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = () => sprites[(Math.random() * sprites.length) | 0];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

// ===== Fill text from CONFIG =====
$('giftGreet').textContent = CONFIG.giftGreeting;
$('kicker').textContent = CONFIG.monthsaryDate + " · " + CONFIG.monthsCount;
$('heading').textContent = CONFIG.greeting;
$('forLine').textContent = "For " + CONFIG.herName;
$('cardMsg').textContent = CONFIG.cardMessage;
$('quote').textContent = CONFIG.quote;
$('fromLine').textContent = "From: " + CONFIG.myName;
$('toLine').textContent = "To: " + CONFIG.herName;
$('letterDate').textContent = "Date: " + CONFIG.monthsaryDate;

// ===== Sprites: load flowers and cut out the white background =====
function loadImage(src) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}
function cutoutURL(img) {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d', { willReadFrequently: true });
  const k = Math.min(S / img.naturalWidth, S / img.naturalHeight);
  const w = img.naturalWidth * k, h = img.naturalHeight * k;
  x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
  try {
    const d = x.getImageData(0, 0, S, S);
    const px = d.data;
    const isBg = i => {
      const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2];
      return Math.max(r, g, b) > 200 && Math.max(r, g, b) - Math.min(r, g, b) < 30;
    };
    const seen = new Uint8Array(S * S), stack = [];
    const add = i => { if (!seen[i] && isBg(i)) { seen[i] = 1; stack.push(i); } };
    for (let j = 0; j < S; j++) { add(j); add((S - 1) * S + j); add(j * S); add(j * S + S - 1); }
    while (stack.length) {
      const i = stack.pop();
      px[i * 4 + 3] = 0;
      const cx = i % S, cy = (i / S) | 0;
      if (cx > 0) add(i - 1);
      if (cx < S - 1) add(i + 1);
      if (cy > 0) add(i - S);
      if (cy < S - 1) add(i + S);
    }
    x.putImageData(d, 0, 0);
  } catch (e) { /* keep original if blocked */ }
  return c.toDataURL('image/png');
}
function petalURL(color) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  x.translate(32, 32);
  for (let i = 0; i < 5; i++) {
    x.rotate(Math.PI * 2 / 5);
    x.beginPath();
    x.ellipse(0, -16, 10, 16, 0, 0, Math.PI * 2);
    x.fillStyle = color;
    x.fill();
  }
  return c.toDataURL('image/png');
}
async function getSprites() {
  const imgs = (await Promise.all(FLOWER_FILES.map(loadImage))).filter(Boolean);
  if (!imgs.length) return [petalURL('#e8557a'), petalURL('#ff8fab'), petalURL('#f5c2cf')];
  return imgs.map(im => { try { return cutoutURL(im); } catch (e) { return im.src; } });
}

// ===== Flower field (edges and corners included) =====
function build(intro) {
  garden.innerHTML = '';
  wraps = [];
  const W = innerWidth, H = innerHeight;
  const cell = Math.max(70, Math.min(W, H) / 7);
  const cols = Math.ceil(W / cell) + 2, rows = Math.ceil(H / cell) + 2;
  const cx = W / 2, cy = H / 2, maxD = Math.hypot(cx, cy) || 1;
  const items = [];
  for (let r = -1; r < rows - 1; r++) {
    for (let c = -1; c < cols - 1; c++) {
      const ox = (c + .5) * cell + rand(-.35, .35) * cell;
      const oy = (r + .5) * cell + rand(-.35, .35) * cell;
      items.push({ ox, oy, size: cell * rand(1.3, 1.7), layer: 2, op: 1 });
      if (Math.random() < .7) {
        items.push({ ox: ox + rand(-.2, .2) * cell, oy: oy + rand(-.2, .2) * cell,
                     size: cell * rand(1.8, 2.3), layer: 3, op: 1 });
      }
    }
  }
  items.forEach(it => {
    const dx = it.ox - cx, dy = it.oy - cy;
    const dist = Math.hypot(dx, dy) / maxD;
    const w = document.createElement('div');
    w.className = 'flower';
    w.style.cssText = `left:${it.ox - it.size / 2}px;top:${it.oy - it.size / 2}px;width:${it.size}px;height:${it.size}px;z-index:${it.layer}`;
    const img = document.createElement('img');
    img.src = pick(); img.alt = ''; img.draggable = false;
    img.style.setProperty('--rot', rand(-45, 45).toFixed(1) + 'deg');
    img.style.setProperty('--dur', rand(5, 9).toFixed(2) + 's');
    img.style.setProperty('--delay', (-rand(0, 8)).toFixed(2) + 's');
    img.style.opacity = it.op;
    w.appendChild(img);
    garden.appendChild(w);
    wraps.push(w);
    if (intro && !reduced) {
      w.animate([
        { transform: `translate(${dx * 1.3}px,${dy * 1.3}px) scale(.25) rotate(${rand(-180, 180)}deg)`, opacity: 0 },
        { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 }
      ], { duration: rand(1100, 1700), delay: (1 - dist) * 1500 + rand(0, 600),
           easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    }
  });
}

function makePetals() {
  petalBox.innerHTML = '';
  if (reduced) return;
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('img');
    p.className = 'petal'; p.src = pick(); p.alt = '';
    p.style.width = rand(22, 38) + 'px';
    p.style.left = rand(-5, 95) + 'vw';
    p.style.animationDuration = rand(10, 18).toFixed(2) + 's';
    p.style.animationDelay = (-rand(0, 18)).toFixed(2) + 's';
    petalBox.appendChild(p);
  }
}

// ===== Petal burst from a tap on the background =====
function burst(x, y) {
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('img');
    p.className = 'bp'; p.src = pick(); p.alt = '';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    petalBox.appendChild(p);
    const a = rand(0, Math.PI * 2), d = rand(60, 180);
    const anim = p.animate([
      { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px),calc(-50% + ${Math.sin(a) * d + 40}px)) scale(.9) rotate(${rand(-240, 240)}deg)`, opacity: 0 }
    ], { duration: rand(1400, 2200), easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    anim.onfinish = () => p.remove();
  }
}
document.addEventListener('pointerdown', e => {
  if (!revealed) return;
  if (e.target.closest('button,a,audio,.sheet,.gbox,.card,#musicBtn')) return;
  burst(e.clientX, e.clientY);
});

// ===== Gift opening: burst, then greeting =====
function reveal() {
  revealed = true;
  document.body.classList.remove('bursting');
  document.body.classList.add('revealed');
}
function openGift() {
  if (!sprites.length || opened) return;
  opened = true;
  $('gift').classList.add('open');
  $('hint').style.display = 'none';
  document.body.classList.add('bursting');
  later(() => { build(true); makePetals(); }, reduced ? 0 : 900);
  later(() => $('giftScene').classList.add('gone'), reduced ? 0 : 1500);
  later(reveal, reduced ? 0 : 3600);
}
$('gift').addEventListener('click', openGift);

// ===== Replay: back to the gift, tap again for a fresh burst =====
function closeAll() {
  $('letter').classList.remove('show');
  const g = $('gardenView');
  g.classList.remove('show', 'open');
  clearInterval(typeTimer);
}
function replay() {
  clearTimers();
  closeAll();
  revealed = false;
  opened = false;
  document.body.classList.remove('revealed', 'bursting');
  garden.innerHTML = '';
  wraps = [];
  petalBox.innerHTML = '';
  $('giftScene').classList.remove('gone');
  $('gift').classList.remove('open');
  $('hint').style.display = '';
}
$('btnReplay').addEventListener('click', replay);

// ===== Our memories =====
function buildMemories() {
  const grid = $('mGrid');
  grid.innerHTML = '';
  CONFIG.memories.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'mem';
    b.type = 'button';
    b.dataset.i = i;
    b.style.setProperty('--d', (i * 0.15) + 's');
    const frame = document.createElement('div');
    frame.className = 'frame';
    const img = document.createElement('img');
    img.alt = m.title;
    if (m.photo) {
      img.src = m.photo;
    } else {
      frame.classList.add('fallback');
      img.src = sprites[i % sprites.length];
      img.alt = '';
    }
    frame.appendChild(img);
    const cap = document.createElement('span');
    cap.className = 'cap';
    cap.textContent = m.title;
    b.appendChild(frame);
    b.appendChild(cap);
    grid.appendChild(b);
  });
}
$('mGrid').addEventListener('click', e => {
  const card = e.target.closest('.mem');
  if (!card) return;
  const m = CONFIG.memories[card.dataset.i];
  const note = $('mNote');
  note.innerHTML = '';
  const t = document.createElement('strong');
  t.textContent = m.title;
  const p = document.createElement('span');
  p.textContent = m.text;
  note.append(t, p);
});
$('btnGarden').addEventListener('click', () => {
  const g = $('gardenView');
  g.classList.remove('open');
  g.classList.add('show');
  $('mNote').textContent = 'Tap a memory to read it.';
  requestAnimationFrame(() => g.classList.add('open'));
});
$('gBack').addEventListener('click', closeAll);

// ===== Letter with typewriter effect =====
function typeText(el, text) {
  clearInterval(typeTimer);
  el.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) clearInterval(typeTimer);
  }, 28);
}
$('btnLetter').addEventListener('click', () => {
  $('letter').classList.add('show');
  typeText($('letterBody'), CONFIG.letter.join("\n\n"));
});
$('closeLetter').addEventListener('click', closeAll);
$('letter').addEventListener('click', e => { if (e.target.id === 'letter') closeAll(); });
$('gardenView').addEventListener('click', e => { if (e.target.id === 'gardenView') closeAll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

// ===== Music (optional, starts only when chosen) =====
const bgm = $('bgm'), musicBtn = $('musicBtn');
if (CONFIG.music) {
  bgm.src = CONFIG.music;
  musicBtn.hidden = false;
  bgm.addEventListener('error', () => { musicBtn.hidden = true; });
  musicBtn.addEventListener('click', () => {
    if (bgm.paused) {
      bgm.play().then(() => { musicBtn.textContent = 'Pause music'; }).catch(() => {});
    } else {
      bgm.pause();
      musicBtn.textContent = 'Play music';
    }
  });
}

// ===== Boot =====
getSprites().then(s => {
  sprites = s;
  buildMemories();
  document.body.classList.add('ready');
});
let rt = null;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (revealed) build(false); }, 300);
});
</script>
</body>
