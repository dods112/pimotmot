<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B0710">
<title>For my favorite person</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--burg:#3B0710;--wine:#641525;--rose:#C42648;--ivory:#FFF6E8;--blush:#F5B9C5;--gold:#D8B16A;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 40%,var(--wine),var(--burg) 65%,#220308);color:var(--ivory);font-family:"Cormorant Garamond",Georgia,serif;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0}
.layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#glow{z-index:0;background:radial-gradient(circle at 50% 45%,rgba(196,38,72,.35),transparent 60%);opacity:0;transition:opacity 3s}
body.ready #glow{opacity:1}
#veil{z-index:0;opacity:0;background:radial-gradient(ellipse 60% 55% at 50% 47%,rgba(59,7,16,.45),transparent);transition:opacity 1.4s}
body.revealed #veil{opacity:1}
#garden{z-index:1}
#petals{z-index:2}
#sparkles{z-index:3}

/* Flowers: real cutouts, full color, never block touches */
.flower{position:absolute;pointer-events:none}
.flower img{width:100%;height:100%;display:block;transform-origin:50% 60%;user-select:none;-webkit-user-drag:none}
.flower img.sway{animation:sway var(--dur,8s) ease-in-out var(--dl,0s) infinite alternate}
.flower.drift{animation:drift var(--dd,30s) linear var(--ddl,0s) infinite}
@keyframes sway{from{transform:rotate(calc(var(--rot) - 3deg))}to{transform:rotate(calc(var(--rot) + 3deg))}}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}
.petal{position:absolute;top:-60px;width:24px;height:auto;animation:fall linear infinite;opacity:.85}
@keyframes fall{from{transform:translate(0,-8vh) rotate(0)}to{transform:translate(22vw,118vh) rotate(540deg)}}
.bp{position:absolute;width:44px;height:44px;pointer-events:none}
.gold{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#ffd98a;box-shadow:0 0 10px #ffd98a;opacity:0;animation:goldRise linear infinite}
@keyframes goldRise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh);opacity:0}}

/* Intro */
#intro{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:calc(1rem + var(--st)) 1rem calc(1rem + var(--sb));transition:opacity 1s}
#intro.gone{opacity:0;pointer-events:none}
#giftGreet{font-family:"Great Vibes",cursive;font-size:clamp(1.7rem,7vw,2.8rem);text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.gift{position:relative;width:min(44vw,180px);height:min(40vw,160px);min-width:120px;min-height:110px;animation:float 3.2s ease-in-out infinite}
.gift .base{position:absolute;left:0;bottom:0;width:100%;height:66%;background:linear-gradient(90deg,#a81f3a,#e0506f 50%,#a81f3a);border-radius:5px;box-shadow:0 14px 28px rgba(0,0,0,.45);transition:transform .8s}
.gift .lid{position:absolute;left:-5%;top:20%;width:110%;height:24%;background:linear-gradient(90deg,#c52d4d,#f4758f 50%,#c52d4d);border-radius:5px;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform 1s cubic-bezier(.3,1.5,.5,1),opacity .9s}
.rib{position:absolute;top:0;bottom:0;left:50%;width:14%;transform:translateX(-50%);background:#ffe3ea}
.gift .bow{position:absolute;top:-30%;left:50%;width:46%;height:52%;transform:translateX(-50%);transition:opacity .4s}
.bow span{position:absolute;top:0;width:50%;height:100%;border:7px solid #ffe3ea;border-radius:50%}
.bow span:first-child{left:0;transform:rotate(-30deg)}
.bow span:last-child{right:0;transform:rotate(30deg)}
.gift.open .lid{transform:translateY(-130px) rotate(-22deg);opacity:0}
.gift.open .base{transform:scale(.94)}
.gift.open .bow{opacity:0}
.gift:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
#hint{font-size:clamp(.85rem,3.5vw,1rem);letter-spacing:.2em;text-transform:uppercase;color:var(--blush);animation:blink 2s ease-in-out infinite}
.skip{position:fixed;top:calc(.8rem + var(--st));left:calc(.8rem + env(safe-area-inset-left,0px));z-index:50;min-height:44px;padding:.3rem 1rem;border-radius:999px;background:rgba(59,7,16,.75);border:1px solid var(--gold);font-style:italic}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}

/* Hero */
#hero{position:fixed;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;padding:calc(1.2rem + var(--st)) 1rem calc(1.2rem + var(--sb))}
body.revealed #hero{visibility:visible}
#heroInner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding-top:2rem}
.rv{opacity:0;transform:translateY(16px);transition:opacity 1.2s var(--d,0s),transform 1.2s var(--d,0s)}
body.revealed .rv{opacity:1;transform:none}
.kicker{font-size:clamp(1rem,3.6vw,1.3rem);font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#FFE7A8;text-shadow:0 0 10px rgba(0,0,0,.9),0 2px 6px rgba(0,0,0,.9),0 0 22px rgba(216,177,106,.45);background:rgba(40,4,12,.55);padding:.35rem .9rem;border-radius:999px;border:1px solid rgba(216,177,106,.55)}
.heading{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.4rem,10vw,5.2rem);line-height:1.1;text-shadow:0 0 18px rgba(245,185,197,.45),0 2px 14px rgba(0,0,0,.6);overflow-wrap:break-word;max-width:100%}
.card{position:relative;background:linear-gradient(160deg,#fff7e8,#f5e4c6);color:#4a1420;width:min(90vw,440px);padding:1.4rem 1.5rem 1.7rem;border-radius:6px 6px 10px 10px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.card .for{font-style:italic;font-size:clamp(1rem,3.8vw,1.1rem);margin-bottom:.4rem}
.card .msg{font-size:clamp(1.05rem,4vw,1.2rem);line-height:1.6;overflow-wrap:break-word}
.heartBtn{position:fixed;right:14px;bottom:calc(14px + var(--sb));z-index:12;width:46px;height:46px;min-width:44px;min-height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e0506f,#8a1630);color:var(--ivory);font-size:1.2rem;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.counter{font-size:clamp(1.05rem,4vw,1.25rem);color:var(--gold);text-shadow:0 1px 8px rgba(0,0,0,.7)}
.counterDays{font-size:clamp(.9rem,3.2vw,1rem);letter-spacing:.12em;color:var(--blush);text-shadow:0 1px 8px rgba(0,0,0,.7)}
.quote{font-family:"Great Vibes",cursive;font-size:clamp(1.5rem,6.5vw,2.2rem);line-height:1.35;max-width:600px;text-shadow:0 2px 12px rgba(0,0,0,.7);padding:0 .4rem}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;max-width:100%;margin-top:.3rem}
.btn{min-height:44px;padding:.6rem 1.3rem;border-radius:999px;background:var(--rose);color:#fff;font-style:italic;font-size:clamp(1rem,3.8vw,1.1rem);box-shadow:0 8px 18px rgba(0,0,0,.35);white-space:nowrap}
.btn.ghost{background:rgba(59,7,16,.6);border:1px solid var(--gold);color:var(--ivory)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}


/* Word-by-word letter text */
.para{opacity:1;animation:none}
.w{display:inline-block;opacity:0;transform:translateY(8px);animation:wordIn .5s ease forwards;animation-delay:var(--wd,0s)}
@keyframes wordIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Envelope card */
.envCard{position:relative;width:min(88vw,460px);height:min(58vw,280px);max-height:300px;min-height:200px;padding:0;border-radius:6px;background:linear-gradient(160deg,#fbf0d8,#f1dcb0);box-shadow:0 18px 36px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.35);cursor:pointer;overflow:visible;transition:transform .4s ease,box-shadow .4s ease}
.envCard:hover{transform:translateY(-3px)}
.envCard::before{content:"";position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(35deg,rgba(150,110,50,.04) 0 2px,transparent 2px 6px);pointer-events:none}
.envCard::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(#f0dcaa,#dfc386);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0;transform-origin:top center;transition:transform .9s cubic-bezier(.3,.7,.3,1),z-index 0s .4s;z-index:2;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.envCard.open::after{transform:rotateX(180deg);z-index:0}
.envFace{position:absolute;left:0;right:0;bottom:14%;display:flex;flex-direction:column;align-items:center;gap:.5rem;z-index:3;pointer-events:none}
.envWax{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d24a66,#8a1630);color:var(--ivory);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.tapHint{font-style:italic;font-size:1rem;letter-spacing:.08em;color:#8a4a58}
.envCard:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
.envCard .heartBtn{display:none}

/* Music */
#musicBar{position:fixed;top:calc(.8rem + var(--st));right:calc(.8rem + env(safe-area-inset-right,0px));z-index:40;display:flex;align-items:center;gap:.5rem;background:rgba(59,7,16,.8);border:1px solid var(--gold);border-radius:999px;padding:.2rem .6rem .2rem .2rem;max-width:calc(100vw - 2rem)}
#musicBtn{width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;font-size:1rem;flex:0 0 auto}
.mtxt{display:flex;flex-direction:column;line-height:1.2;min-width:0;padding-right:.3rem}
.mtxt b{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.mtxt small{font-size:.8rem;color:var(--blush);font-style:italic}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(40,4,12,.7);padding:calc(.6rem + var(--st)) .6rem calc(.6rem + var(--sb));overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay.show{display:flex}
.panel{position:relative;width:min(94vw,560px);max-height:calc(100dvh - 1.4rem - var(--st) - var(--sb));overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(#fff7e8,#f7e7cc);color:#3e1220;border-radius:8px;padding:2.2rem 1.5rem 1.6rem;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:pop .5s ease both}
.panel.wide{width:min(96vw,1040px);background:none;box-shadow:none;color:var(--ivory);padding:2rem .5rem;overflow:visible}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.x{position:absolute;top:.2rem;right:.3rem;width:44px;height:44px;font-size:2rem;color:#7a2a3a;line-height:1;z-index:3;display:flex;align-items:center;justify-content:center}
.gtitle{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.1;text-align:center;text-shadow:0 0 16px rgba(245,185,197,.4),0 2px 10px rgba(0,0,0,.7)}
.gsub{font-size:.9rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blush);text-align:center;margin:.2rem 0 1.2rem;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.panel.wide .gtitle{color:var(--ivory)}

/* Letter */
.letterWrap{position:relative;width:min(94vw,560px);display:flex;flex-direction:column;align-items:center}
.envelope{position:relative;width:min(80vw,340px);aspect-ratio:1.5;background:#f3e3c3;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.45);cursor:pointer;margin-top:1rem}
.envelope .flap{position:absolute;left:0;right:0;top:0;height:58%;background:#e6cf9f;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .7s ease;z-index:2}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope .wax{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c93a55,#8a1630);color:var(--ivory);display:flex;align-items:center;justify-content:center;font-size:1.3rem;z-index:3}
.envelope.gone{display:none}
.envelope:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.envelope::after{content:"Tap to open";position:absolute;left:0;right:0;bottom:-2.2rem;text-align:center;font-style:italic;color:var(--blush)}
.sheet{display:none;width:100%;background:linear-gradient(#fff7e8,#f7e7cc);color:#3e1220;border-radius:6px;padding:2.4rem 1.5rem 1.8rem;max-height:calc(100dvh - 8rem - var(--st) - var(--sb));overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.sheet.show{display:block;animation:unfold .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes unfold{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
.sheet .from{font-style:italic;font-size:1rem}
.sheet .to{font-family:"Great Vibes",cursive;font-size:clamp(1.8rem,7vw,2.2rem);margin:.3rem 0 .8rem}
.para{font-size:clamp(1.05rem,4vw,1.15rem);line-height:1.75;margin-bottom:.9rem;opacity:0;animation:paraIn .8s ease both;animation-delay:var(--d,0s)}
@keyframes paraIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sig{font-family:"Great Vibes",cursive;font-size:clamp(1.9rem,7vw,2.4rem);line-height:1.2;margin-top:1rem;opacity:0;animation:paraIn 1s ease both;animation-delay:var(--d,0s)}
.sig small{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1rem}

/* Gallery */
.track{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:.6rem 1rem 1.2rem;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.card-mem{flex:0 0 min(70vw,250px);scroll-snap-align:center;background:linear-gradient(170deg,#fffaf0,#f6e8cf);color:#4a1420;border-radius:3px;padding:.6rem .6rem .9rem;box-shadow:0 10px 22px rgba(0,0,0,.4);text-align:left;transform:rotate(var(--t,0deg));min-height:44px}
.ph{aspect-ratio:4/5;background:#f3d6dc;overflow:hidden;border-radius:2px;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph img.fallback{object-fit:contain;padding:12%}
.card-mem .t{display:block;font-family:"Great Vibes",cursive;font-size:1.7rem;line-height:1.1;margin-top:.4rem}
.card-mem .d{display:block;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#8a4a58;margin-top:.5rem}
.card-mem .c{display:block;font-style:italic;color:#5c2a36}

/* Lightbox */
.lb .lbImg{width:100%;aspect-ratio:4/3;max-height:45dvh;background:#f3d6dc;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.lb .lbImg img{width:100%;height:100%;object-fit:contain}
.lb .lbImg img.fallback{padding:10%}
.lb .dt{margin-top:.8rem;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#8a4a58;text-align:center}
.lb h3{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(1.9rem,7vw,2.6rem);text-align:center;line-height:1.1}
.lb .cap{font-style:italic;text-align:center;color:#5c2a36;font-size:1.1rem;margin-bottom:.6rem}
.lb .txt{font-size:clamp(1rem,4vw,1.1rem);line-height:1.7;white-space:pre-wrap;overflow-wrap:break-word}
.lbNav{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:.5rem}
.nav{min-height:44px;padding:.5rem 1rem;border-radius:999px;background:var(--rose);color:#fff;font-style:italic;white-space:nowrap}
.nav:disabled{opacity:.4}
.lbCount{font-size:.9rem;color:#8a4a58;letter-spacing:.08em}

/* Reasons */
.reasonList{list-style:none;display:grid;gap:.6rem;margin-top:.8rem}
.reason{width:100%;min-height:44px;text-align:left;background:#fffaf0;border:1px solid #e9d3a6;border-radius:6px;padding:.7rem .9rem;color:#4a1420;font-size:1.1rem}
.reason span{display:block;margin-top:.35rem;font-style:italic;color:#5c2a36;line-height:1.5}
.secret{display:block;margin:1.2rem auto 0;min-width:44px;min-height:44px;font-size:1.9rem;color:#c42648;opacity:.35}
.surprise{font-family:"Great Vibes",cursive;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.3;text-align:center;color:#8a1630;margin-top:.6rem;animation:paraIn 1s ease both}

@media (max-width:600px){
  #heroInner{gap:.8rem;padding-top:1.5rem}
  .card{width:92vw;padding:1.2rem 1.2rem 1.5rem}
  .btn{flex:1 1 auto;min-width:0;padding:.6rem .9rem}
  .mtxt small{display:none}
  .mtxt b{max-width:120px}
  .track{gap:.8rem}
  .card-mem{flex-basis:72vw}
}
@media (max-width:380px){
  .heading{font-size:clamp(2.1rem,11vw,3rem)}
  .btns{flex-direction:column;align-items:stretch;width:100%;max-width:280px;margin:0 auto}
  .btn{flex:none;width:100%}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .flower img.sway,.flower.drift,.petal,.gold,.gift,#hint{animation:none !important}
}
</style>
</head>
<body>

<div id="glow" class="layer"></div>
<div id="veil" class="layer"></div>
<div id="garden" class="layer"></div>
<div id="petals" class="layer"></div>
<div id="sparkles" class="layer"></div>

<section id="intro">
  <p id="giftGreet"></p>
  <button id="gift" class="gift" aria-label="Open your gift">
    <div class="lid"><div class="rib"></div></div>
    <div class="base"><div class="rib"></div></div>
    <div class="bow"><span></span><span></span></div>
  </button>
  <p id="hint">Tap the gift</p>
</section>
<button id="skip" class="skip" hidden>Skip intro</button>

<section id="hero">
  <div id="heroInner">
    <p class="kicker rv" style="--d:0s" id="kicker"></p>
    <h1 class="heading rv" style="--d:.4s" id="heading"></h1>
    <div class="card rv envCard" id="envCard" role="button" tabindex="0" aria-label="Open the letter" style="--d:.9s">
      <p class="for" id="forLine"></p>
      <p class="msg" id="cardMsg"></p>
      <p class="tapHint">Tap to open</p>
      <button class="heartBtn" id="heartBtn" aria-label="Send a burst of petals">♥</button>
    </div>
    <p class="counter rv" style="--d:1.3s" id="counter"></p>
    <p class="counterDays rv" style="--d:1.4s" id="counterDays"></p>
    <p class="quote rv" style="--d:1.7s" id="quote"></p>
    <div class="btns rv" style="--d:2.1s">
      <button class="btn" id="btnLetter">Read my letter</button>
      <button class="btn ghost" id="btnGarden">Our garden</button>
            <button class="btn ghost" id="btnReplay">Replay</button>
    </div>
  </div>
</section>

<div id="musicBar" hidden>
  <button id="musicBtn" aria-label="Play music">▶</button>
  <span class="mtxt"><b id="songTitle"></b><small id="musicState" aria-live="polite">Paused</small></span>
</div>
<audio id="bgm" preload="none" loop></audio>

<div id="letter" class="overlay" role="dialog" aria-modal="true" aria-label="Love letter">
  <div class="letterWrap">
    <button class="x" data-close="letter" aria-label="Close letter" style="color:var(--ivory)">×</button>
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open envelope">
      <div class="flap"></div>
      <div class="wax">♥</div>
    </div>
    <div class="sheet" id="sheet">
      <p class="from" id="fromLine"></p>
      <p class="to" id="toLine"></p>
      <div id="letterBody"></div>
      <p class="sig" id="sig">With love,<small id="sigName"></small></p>
    </div>
  </div>
</div>

<div id="gallery" class="overlay" role="dialog" aria-modal="true" aria-label="Our garden">
  <div class="panel wide">
    <button class="x" data-close="gallery" aria-label="Close gallery" style="color:var(--ivory)">×</button>
    <h2 class="gtitle">Our garden</h2>
    <p class="gsub">Swipe to explore our memories</p>
    <div class="track" id="track"></div>
  </div>
</div>

<div id="lightbox" class="overlay" role="dialog" aria-modal="true" aria-label="Memory">
  <div class="panel lb">
    <button class="x" data-close="lightbox" aria-label="Close memory">×</button>
    <div class="lbImg"><img id="lbImg" alt=""></div>
    <p class="dt" id="lbDate"></p>

</div>

</div>

<script>
// ===== EDIT YOUR PERSONAL CONTENT HERE =====
const CONFIG = {
  myName: "dodis",
  herName: "Jo",
  callSign: "Jo",
  startDate: "",          // REPLACE: first day together, YYYY-MM-DD (drives the counter)

    "And also sorry sab Jo og nay time nga dili ko vocal saimo when it comes sa mga away away or unsa ba hehe. Sensya kaayu. Pero thank you sa tanan tanan Jo. Thank you kay kauban japon tika hangtod ron maskig ga struggles mi sa akong fam. Thank you sa mga sacrifices nga imong gi hatag og gi buhat Jo. Thank you kaayu, na appreciate jud nako tanan Jo.",
    "And i love you always Jo hehe. Thank you thank you jud kaayu Jo. Stay pretty Jo. Iloveyouu, narako diri always ha. Mwaaa. Iloveyou so much......"
  ],
  signature: "",
  reasons: [
    "[Reason 1: something she does that you love]",
    "[Reason 2: how she makes you feel]",
    "[Reason 3: a small habit you adore]",
    "[Reason 4: a moment that stayed with you]",
    "[Reason 5: why she is your favorite person]"
  ],
  surprise: "[Your hidden message to her goes here.]",
  music: { src: "music/song.mp3", title: "Best Part", artist: "H.E.R. ft. Daniel Caesar" },  // src "" hides the player
  memories: [
    // photo: "memories/1.jpg" (or "" to show a flower). date: "YYYY-MM-DD".
    { photo: "memories/1.jpg", date: "[YYYY-MM-DD]", title: "[Memory 1]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "memories/2.jpg", date: "[YYYY-MM-DD]", title: "[Memory 2]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "memories/3.jpg", date: "[YYYY-MM-DD]", title: "[Memory 3]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "memories/4.jpg", date: "[YYYY-MM-DD]", title: "[Memory 4]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "", date: "[YYYY-MM-DD]", title: "[Memory 5]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "", date: "[YYYY-MM-DD]", title: "[Memory 6]", caption: "[Short caption]", text: "[Full story]" }
  ]
};

// Repaired transparent flowers
const FLOWER_FILES = [
  "assets/flowers/flower1.png", "assets/flowers/flower2.png", "assets/flowers/flower3.png",
  "assets/flowers/flower4.png", "assets/flowers/flower5.png", "assets/flowers/flower6.png"
];

// ===== Helpers =====
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const phone = () => innerWidth <= 600;
const rand = (a, b) => a + Math.random() * (b - a);
let sprites = [], timers = [], built = false, revealed = false, busy = false, stack = [], cur = 0, tx = null;
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function clearLater() { timers.forEach(clearTimeout); timers = []; }
const pick = () => sprites[(Math.random() * sprites.length) | 0];
function petalSVG(c) {
  const p = [0, 72, 144, 216, 288].map(a => `<ellipse cx="32" cy="18" rx="10" ry="16" transform="rotate(${a} 32 32)"/>`).join('');
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="${c}">${p}</g></svg>`);
}

// ===== Load flowers; fall back gracefully if any file is missing =====
function loadSprite(src) {
  return new Promise(r => { const i = new Image(); i.onload = () => r(src); i.onerror = () => r(null); i.src = src; });
}
async function loadSprites() {
  const ok = (await Promise.all(FLOWER_FILES.map(loadSprite))).filter(Boolean);
  sprites = ok.length ? ok : [petalSVG('#e8557a'), petalSVG('#ff8fab'), petalSVG('#f5c2cf')];
}

// ===== Text from CONFIG =====
function fillText() {
  $('giftGreet').textContent = CONFIG.giftGreeting;
  $('kicker').textContent = CONFIG.monthsaryDate + ' · ' + CONFIG.monthsCount;
  $('heading').textContent = CONFIG.greeting;
  $('forLine').textContent = 'For ' + CONFIG.herName;
  $('cardMsg').textContent = CONFIG.cardMessage;
  $('quote').textContent = CONFIG.quote;
  $('fromLine').textContent = 'From: ' + CONFIG.myName;
  $('toLine').textContent = 'To: ' + CONFIG.herName;
  $('sigName').textContent = CONFIG.signature;
  $('surprise').textContent = CONFIG.surprise;
}
function buildLetter() {
  const b = $('letterBody');
  b.innerHTML = '';
  let k = 0;
  const WD = 0.03;
  CONFIG.letter.forEach(t => {
    const p = document.createElement('p');
    p.className = 'para';
    t.split(/(\s+)/).forEach(tok => {
      if (tok === '' || /^\s+$/.test(tok)) { p.appendChild(document.createTextNode(tok)); return; }
      const sp = document.createElement('span');
      sp.className = 'w';
      sp.textContent = tok;
      sp.style.setProperty('--wd', (0.3 + k * WD).toFixed(2) + 's');
      k++;
      p.appendChild(sp);
    });
    b.appendChild(p);
  });
  $('sig').style.setProperty('--d', (0.3 + k * WD + 0.4).toFixed(2) + 's');
}
function buildReasons() {
  const ul = $('reasonList');
  ul.innerHTML = '';
  CONFIG.reasons.forEach((r, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'reason';
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.append('Reason ' + (i + 1));
    const s = document.createElement('span');
    s.textContent = r;
    s.hidden = true;
    b.appendChild(s);
    b.addEventListener('click', () => {
      s.hidden = !s.hidden;
      b.setAttribute('aria-expanded', String(!s.hidden));
      if (!s.hidden) burst(b.getBoundingClientRect().right - 20, b.getBoundingClientRect().top + 20, phone() ? 4 : 6);
    });
    li.appendChild(b);
    ul.appendChild(li);
  });
}
function imgFor(src) {
  const img = document.createElement('img');
  img.alt = '';
  img.decoding = 'async';
  img.src = src || pick();
  if (!src) img.classList.add('fallback');
  img.onerror = () => { img.src = pick(); img.classList.add('fallback'); };
  return img;
}
function buildGallery() {
  const t = $('track');
  t.innerHTML = '';
  CONFIG.memories.forEach((m, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'card-mem';
    b.dataset.i = i;
    b.style.setProperty('--t', i % 2 ? '1deg' : '-1deg');
    const ph = document.createElement('div');
    ph.className = 'ph';
    const img = imgFor(m.photo);
    img.loading = 'lazy';
    ph.appendChild(img);
    const d = document.createElement('span'); d.className = 'd'; d.textContent = m.date || '';
    const tt = document.createElement('span'); tt.className = 't'; tt.textContent = m.title;
    const c = document.createElement('span'); c.className = 'c'; c.textContent = m.caption || '';
    b.append(ph, d, tt, c);
    t.appendChild(b);
  });
}

// ===== Counter: years, months, days since the start date =====
function updateCounter() {
  const s = new Date(CONFIG.startDate + 'T00:00:00'), n = new Date();
  let y = n.getFullYear() - s.getFullYear(), m = n.getMonth() - s.getMonth(), d = n.getDate() - s.getDate();
  if (d < 0) { m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const days = Math.max(0, Math.floor((n - s) / 864e5));
  const tm = CONFIG.totalMonths || 0, yy = Math.floor(tm / 12), mm = tm % 12;
  $('counter').textContent = yy + (yy === 1 ? ' year' : ' years') + ' · ' + mm + (mm === 1 ? ' month' : ' months');
  $('counterDays').textContent = CONFIG.startDate ? Math.max(0, Math.floor((n - s) / 864e5)).toLocaleString() + ' days together' : '';
}

// ===== Petal bursts and golden sparkles =====
function burst(x, y, n) {
  if (reduced || n <= 0) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('img');
    p.className = 'bp'; p.src = pick(); p.alt = '';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    $('petals').appendChild(p);
    const a = rand(0, Math.PI * 2), d = rand(70, 190);
    const an = p.animate([
      { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px),calc(-50% + ${Math.sin(a) * d + 50}px)) scale(.9) rotate(${rand(-240, 240)}deg)`, opacity: 0 }
    ], { duration: rand(1300, 2100), easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    an.onfinish = () => p.remove();
  }
}
function sparkles(n) {
  const box = $('sparkles');
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i');
    s.className = 'gold';
    s.style.left = rand(0, 100).toFixed(1) + '%';
    s.style.animationDuration = rand(3, 6).toFixed(1) + 's';
    s.style.animationDelay = rand(0, 2.5).toFixed(1) + 's';
    box.appendChild(s);
  }
  later(() => { box.innerHTML = ''; }, 7000);
}
function makePetals() {
  const box = $('petals');
  box.innerHTML = '';
  if (reduced) return;
  const n = phone() ? 5 : 9;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('img');
    p.className = 'petal'; p.src = pick(); p.alt = '';
    p.style.width = rand(18, 30) + 'px';
    p.style.left = rand(-5, 95) + 'vw';
    p.style.animationDuration = rand(12, 20).toFixed(1) + 's';
    p.style.animationDelay = (-rand(0, 20)).toFixed(1) + 's';
    box.appendChild(p);
  }
}

// ===== Flower frame: big flowers on the edges, small ones drifting, open center =====
function build(intro) {
  const field = $('garden');
  field.innerHTML = '';
  const W = innerWidth, H = innerHeight, ph = phone(), cx = W / 2, cy = H / 2;
  const rx = (ph ? 0.48 : 0.34) * W, ry = (ph ? 0.52 : 0.40) * H;
  const inside = (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1;
  const cell = ph ? Math.max(64, Math.min(W, H) / 3) : Math.max(64, Math.min(W, H) / 3.2);
  const items = [];
  for (let gy = -1; gy < Math.ceil(H / cell) + 1; gy++) {
    for (let gx = -1; gx < Math.ceil(W / cell) + 1; gx++) {
      const ox = (gx + .5) * cell + rand(-.3, .3) * cell, oy = (gy + .5) * cell + rand(-.3, .3) * cell;
      if (!inside(ox, oy)) items.push({ ox, oy, size: cell * rand(.95, 1.25), z: 2, small: false });
      if (!inside(ox + rand(-.5, .5) * cell, oy + rand(-.5, .5) * cell) && Math.random() < .6) items.push({ ox: ox + rand(-.5, .5) * cell, oy: oy + rand(-.5, .5) * cell, size: cell * rand(.8, 1.1), z: 2, small: false });
      if (Math.random() < (ph ? .6 : .85)) {
        const sx = ox + rand(-.4, .4) * cell, sy = oy + rand(-.4, .4) * cell;
        if (!inside(sx, sy)) items.push({ ox: sx, oy: sy, size: cell * rand(.45, .6), z: 3, small: true });
      }
    }
  }
  const max = ph ? 80 : 170;
  while (items.length > max) items.splice((Math.random() * items.length) | 0, 1);

  items.forEach(it => {
    const w = document.createElement('div');
    w.className = 'flower' + (it.small ? ' drift' : '');
    w.style.cssText = `left:${it.ox - it.size / 2}px;top:${it.oy - it.size / 2}px;width:${it.size}px;height:${it.size}px;z-index:${it.z}`;
    const im = document.createElement('img');
    im.src = pick(); im.alt = ''; im.draggable = false; im.decoding = 'async';
    im.onerror = () => { im.src = petalSVG('#e8557a'); };
    if (!it.small && Math.random() < .35) {
      im.className = 'sway';
      im.style.setProperty('--rot', rand(-20, 20).toFixed(1) + 'deg');
      im.style.setProperty('--dur', rand(7, 11).toFixed(1) + 's');
      im.style.setProperty('--dl', (-rand(0, 10)).toFixed(1) + 's');
    }
    if (it.small) {
      w.style.setProperty('--dx', rand(-30, 30).toFixed(0) + 'px');
      w.style.setProperty('--dy', rand(-30, 30).toFixed(0) + 'px');
      w.style.setProperty('--dd', rand(24, 38).toFixed(1) + 's');
      w.style.setProperty('--ddl', (-rand(0, 30)).toFixed(1) + 's');
    }
    w.appendChild(im);
    field.appendChild(w);
    if (intro && !reduced) {
      const dist = Math.hypot((it.ox - cx) / W, (it.oy - cy) / H);
      w.animate([
        { transform: `translate(${(it.ox - cx) * 1.2}px,${(it.oy - cy) * 1.2}px) scale(.2) rotate(${rand(-160, 160)}deg)`, opacity: 0 },
        { transform: 'none', opacity: 1 }
      ], { duration: rand(1000, 1500), delay: (1 - Math.min(1, dist * 1.4)) * 900 + rand(0, 400), easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    }
  });
}

// ===== Intro: gift, burst, reveal. Skip and replay supported =====
function openGift() {
  if (busy || !sprites.length) return;
  busy = true;
  $('gift').classList.add('open');
  $('hint').hidden = true;
  $('skip').hidden = false;
  sparkles(reduced ? 0 : 26);
  later(() => { if (!built) { build(true); makePetals(); built = true; } }, reduced ? 0 : 700);
  later(reveal, reduced ? 0 : 2800);
}
function reveal() {
  clearLater();
  $('intro').classList.add('gone');
  $('skip').hidden = true;
  document.body.classList.add('revealed');
  revealed = true;
  busy = false;
  startPopFlowers();
}
function skipIntro() {
  if (!busy || !sprites.length) return;
  clearLater();
  if (!built) { build(false); makePetals(); built = true; }
  reveal();
}
function replay() {
  clearLater();
  closeAll();
  revealed = false; busy = false; built = false;
  $('garden').innerHTML = '';
  $('petals').innerHTML = '';
  $('sparkles').innerHTML = '';
  document.body.classList.remove('revealed');
  $('intro').classList.remove('gone');
  $('gift').classList.remove('open');
  $('hint').hidden = false;
  $('skip').hidden = true;
}

// ===== Overlays: one stack, Escape/back button close the top layer =====
function lockScroll() { document.body.style.overflow = 'hidden'; }
function unlockScroll() { document.body.style.overflow = ''; }
function openOverlay(id) {
  $(id).classList.add('show');
  if (!stack.length) history.pushState({ layer: 1 }, '');
  stack.push(id);
  lockScroll();
}
function closeTop(fromPop) {
  const id = stack.pop();
  if (!id) return;
  $(id).classList.remove('show');
  if (id === 'letter') { $('sheet').classList.remove('show'); $('envelope').classList.remove('open', 'gone'); $('envCard').classList.remove('open'); }
  if (!stack.length) {
    unlockScroll();
    if (!fromPop && history.state && history.state.layer) history.back();
  }
}
function closeTo(id) { while (stack.length && stack.includes(id)) closeTop(false); }
function closeAll() { while (stack.length) closeTop(false); }
window.addEventListener('popstate', () => { if (stack.length) closeTop(true); });

// ===== Letter =====
function openEnvelope() {
  const env = $('envelope');
  if (env.classList.contains('open')) return;
  env.classList.add('open');
  setTimeout(() => { env.classList.add('gone'); $('sheet').classList.add('show'); }, 700);
}
$('envelope').addEventListener('click', openEnvelope);
$('envelope').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); } });

// ===== Gallery and lightbox =====
function showMem(i) {
  const n = CONFIG.memories.length;
  cur = (i + n) % n;
  const m = CONFIG.memories[cur];
  const img = $('lbImg');
  img.onerror = () => { img.src = pick(); img.classList.add('fallback'); };
  img.classList.toggle('fallback', !m.photo);
  img.src = m.photo || pick();
  $('lbDate').textContent = m.date || '';
  $('lbTitle').textContent = m.title;
  $('lbCap').textContent = m.caption || '';
  $('lbText').textContent = m.text || '';
  $('lbCount').textContent = (cur + 1) + ' / ' + n;
  $('lightbox').querySelector('.panel').scrollTop = 0;
}
function openLightbox(i) {
  showMem(i);
  openOverlay('lightbox');
  burst(innerWidth / 2, innerHeight / 2, reduced ? 0 : (phone() ? 4 : 7));
}

// ===== Music (no autoplay; starts only on a tap) =====
function setupMusic() {
  const m = CONFIG.music;
  if (!m || !m.src) return;
  const bgm = $('bgm'), btn = $('musicBtn');
  bgm.src = m.src;
  $('songTitle').textContent = m.title + ' · ' + m.artist;
  $('musicBar').hidden = false;
  bgm.addEventListener('play', () => { btn.textContent = '❚❚'; btn.setAttribute('aria-label', 'Pause music'); $('musicState').textContent = 'Now playing'; });
  bgm.addEventListener('pause', () => { btn.textContent = '▶'; btn.setAttribute('aria-label', 'Play music'); $('musicState').textContent = 'Paused'; });
  bgm.addEventListener('error', () => { $('musicState').textContent = 'File not found'; btn.disabled = true; });
  btn.addEventListener('click', () => {
    if (bgm.paused) bgm.play().catch(() => { $('musicState').textContent = 'Tap again to play'; });
    else bgm.pause();
  });
}

// ===== Wiring (bound once) =====
$('gift').addEventListener('click', () => {
  const bgm = $('bgm');
  if (CONFIG.music && CONFIG.music.src && bgm.paused) {
    bgm.play().catch(() => {});
  }
  openGift();
});
$('skip').addEventListener('click', skipIntro);
$('btnReplay').addEventListener('click', replay);
$('btnLetter').addEventListener('click', () => { $('envelope').classList.remove('open', 'gone'); $('sheet').classList.remove('show'); openOverlay('letter'); });
$('btnGarden').addEventListener('click', () => openOverlay('gallery'));
$('heartBtn').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, phone() ? 8 : 14); });
$('secret').addEventListener('click', e => {
  $('surprise').hidden = false;
  burst(innerWidth / 2, innerHeight / 2, reduced ? 0 : (phone() ? 10 : 16));
  e.currentTarget.style.opacity = '.9';
});
$('track').addEventListener('click', e => { const b = e.target.closest('.card-mem'); if (b) openLightbox(+b.dataset.i); });
$('lbPrev').addEventListener('click', () => showMem(cur - 1));
$('lbNext').addEventListener('click', () => showMem(cur + 1));
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeTo(b.dataset.close)));
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) closeTo(o.id); }));
const lb = $('lightbox');
lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  tx = null;
  if (Math.abs(dx) > 50) showMem(cur + (dx < 0 ? 1 : -1));
}, { passive: true });
document.addEventListener('keydown', e => {
  const top = stack[stack.length - 1];
  if (e.key === 'Escape' && top) { e.preventDefault(); closeTop(false); return; }
  if (top === 'lightbox') {
    if (e.key === 'ArrowLeft') showMem(cur - 1);
    if (e.key === 'ArrowRight') showMem(cur + 1);
  }
});
document.addEventListener('pointerdown', e => {
  if (!revealed || stack.length) return;
  if (e.target.closest('button,a,.card,#musicBar,.overlay')) return;
  burst(e.clientX, e.clientY, phone() ? 5 : 8);
});
let rt = null;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (revealed) build(false); }, 300);
});

// ===== Card envelope opens the letter =====
function openFromCard() {
  const c = $('envCard');
  c.classList.add('open');
  $('envelope').classList.remove('open', 'gone');
  $('sheet').classList.remove('show');
  openOverlay('letter');
  setTimeout(openEnvelope, 700);
}
$('envCard').addEventListener('click', e => {
  if (e.target.closest('.heartBtn')) return;
  openFromCard();
});
$('envCard').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.heartBtn')) { e.preventDefault(); openFromCard(); }
});


// ===== Flowers that pop up gently around the edges over time =====
let popTimer = null;
function popFlower() {
  if (!revealed || reduced || !sprites.length) return;
  const W = innerWidth, H = innerHeight, ph = phone();
  const cx = W / 2, cy = H / 2;
  const rx = (ph ? 0.48 : 0.34) * W, ry = (ph ? 0.52 : 0.40) * H;
  let x, y, tries = 0;
  do {
    x = rand(-0.05, 1.05) * W;
    y = rand(-0.05, 1.05) * H;
    tries++;
  } while (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1 && tries < 20);
  const size = (ph ? 70 : 110) * rand(0.8, 1.3);
  const w = document.createElement('div');
  w.className = 'flower';
  w.style.cssText = `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;z-index:2`;
  const im = document.createElement('img');
  im.src = pick(); im.alt = ''; im.draggable = false;
  im.onerror = () => { im.src = petalSVG('#e8557a'); };
  w.appendChild(im);
  $('garden').appendChild(w);
  const a = w.animate([
    { opacity: 0, transform: 'scale(.5) rotate(' + rand(-40, 40).toFixed(0) + 'deg)' },
    { opacity: 1, transform: 'scale(1) rotate(' + rand(-8, 8).toFixed(0) + 'deg)', offset: 0.35 },
    { opacity: 1, transform: 'scale(1.02)', offset: 0.8 },
    { opacity: 0, transform: 'scale(.9)' }
  ], { duration: rand(9000, 13000), easing: 'ease-in-out', fill: 'forwards' });
  a.onfinish = () => w.remove();
}
function startPopFlowers() {
  if (popTimer || reduced) return;
  popTimer = setInterval(() => {
    if ($('garden').children.length > (phone() ? 60 : 120)) return;
    popFlower();
  }, phone() ? 1400 : 900);
}

// ===== Boot =====
fillText();
buildLetter();
updateCounter();
setInterval(updateCounter, 60000);
setupMusic();
loadSprites().then(() => {
  buildGallery();
  document.body.classList.add('ready');
});
</script>
