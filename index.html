<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For my favorite person</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#3e0a12;color:#fbe9dc;font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden}
.script{font-family:"Great Vibes",cursive;font-weight:400}
#gift-scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;background:radial-gradient(ellipse at center,#7a1a29 0%,#4a0c16 60%,#2c060d 100%);z-index:4;transition:opacity 1s ease}
#gift-scene.gone{opacity:0;pointer-events:none}
#greet{font-size:clamp(1.8rem,6vw,2.8rem);text-align:center;padding:0 1rem;opacity:0;animation:up 1.6s ease .3s forwards}
.gift{position:relative;width:min(44vw,180px);height:min(40vw,160px);background:none;border:0;cursor:pointer;animation:float 3.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.gift .base{position:absolute;left:0;bottom:0;width:100%;height:66%;background:linear-gradient(90deg,#a81f3a,#e0506f 50%,#a81f3a);border-radius:5px;box-shadow:0 14px 28px rgba(0,0,0,.45);transition:transform .8s ease}
.gift .lid{position:absolute;left:-5%;top:20%;width:110%;height:24%;background:linear-gradient(90deg,#c52d4d,#f4758f 50%,#c52d4d);border-radius:5px;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform 1s cubic-bezier(.3,1.5,.5,1),opacity .9s ease}
.rib{position:absolute;top:0;bottom:0;left:50%;width:14%;transform:translateX(-50%);background:#ffe3ea}
.gift .bow{position:absolute;top:-30%;left:50%;width:46%;height:52%;transform:translateX(-50%);transition:opacity .4s}
.bow span{position:absolute;top:0;width:50%;height:100%;border:7px solid #ffe3ea;border-radius:50%}
.bow span:first-child{left:0;transform:rotate(-30deg)}
.bow span:last-child{right:0;transform:rotate(30deg)}
.gift.open .lid{transform:translateY(-130px) rotate(-22deg);opacity:0}
.gift.open .base{transform:scale(.94)}
.gift.open .bow{opacity:0}
#hint{font-size:1rem;letter-spacing:.2em;text-transform:uppercase;animation:blink 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;transition:opacity 1.5s ease}
#scrap{position:fixed;inset:0;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity 1.6s ease;z-index:3;background:radial-gradient(ellipse at 50% 30%,#8a2234 0%,#4a0c16 70%,#2c060d 100%)}
#scrap.show{opacity:1;pointer-events:auto}
.scrap-inner{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:3rem 1.2rem 5rem;gap:1.6rem}
.kicker{font-size:1rem;letter-spacing:.25em;text-transform:uppercase;color:#f5c2cf;text-align:center}
.title{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(3rem,10vw,5.5rem);line-height:1.05;text-align:center;color:#fff1e6;text-shadow:0 0 18px rgba(255,143,171,.35)}
.paper{position:relative;background:#f7ead5;color:#4a1420;padding:1.4rem 1.3rem 1.6rem;width:min(86vw,380px);box-shadow:0 12px 26px rgba(0,0,0,.4)}
.note-text{font-style:italic;font-size:1.25rem;line-height:1.5;margin:.6rem 0}
.final{font-family:"Great Vibes",cursive;font-size:clamp(1.8rem,5vw,2.4rem);text-align:center;color:#ffd6e0;max-width:560px;line-height:1.3}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
.btn{font:inherit;font-style:italic;font-size:1.1rem;color:#fff;background:#b8243f;border:0;padding:.7rem 1.5rem;border-radius:999px;cursor:pointer;text-decoration:none;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.btn.ghost{background:transparent;border:1px solid #f5c2cf}
#letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,2,6,.6);z-index:20;padding:1.2rem}
#letter.show{display:flex}
.letter-paper{position:relative;background:#f8eedb;color:#3e1220;width:min(92vw,560px);max-height:88vh;overflow-y:auto;padding:2rem 1.8rem;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:unfold .9s ease both}
@keyframes unfold{from{opacity:0;transform:translateY(30px) rotate(-1deg)}to{opacity:1;transform:none}}
.letter-paper .from{font-style:italic;font-size:1.05rem}
.letter-paper .to{font-family:"Great Vibes",cursive;font-size:2.2rem;margin:.6rem 0}
.letter-paper p{font-size:1.15rem;line-height:1.7;margin-bottom:1rem}
.letter-close{position:absolute;top:.5rem;right:.8rem;background:none;border:0;font-size:1.8rem;color:#7a2a3a;cursor:pointer}
</style>
</head>
<body>

<section id="gift-scene">
  <p id="greet" class="script"></p>
  <button id="gift" class="gift" aria-label="Open your gift">
    <div class="lid"><div class="rib"></div></div>
    <div class="base"><div class="rib"></div></div>
    <div class="bow"><span></span><span></span></div>
  </button>
  <p id="hint">Tap the gift</p>
</section>

<canvas id="fx"></canvas>

<section id="scrap" aria-hidden="true">
  <div class="scrap-inner">
    <p class="kicker" id="kicker"></p>
    <h2 class="title" id="title"></h2>
    <div class="paper">
      <p class="note-text" id="note"></p>
      <p class="note-text" id="months"></p>
    </div>
    <p class="final" id="final"></p>
    <div class="actions">
      <button class="btn" id="openLetter">Read my letter</button>
      <a class="btn ghost" href="flower.html">Our garden</a>
      <button class="btn ghost" id="replay">Replay</button>
    </div>
  </div>
</section>

<div id="letter">
  <div class="letter-paper">
    <button class="letter-close" id="closeLetter" aria-label="Close">×</button>
    <p class="from" id="fromLine"></p>
    <p class="to" id="toLine"></p>
    <div id="letterBody"></div>
    <p class="from" id="letterDate"></p>
  </div>
</div>

<script>
// ===== EDIT YOUR PERSONAL CONTENT HERE =====
const CONFIG = {
  myName: "[MY NAME]",
  herName: "[HER NAME]",
  greeting: "For my favorite person...",
  title: "My Favorite Person",
  monthsaryDate: "[OUR MONTHSARY DATE]",
  monthsCount: "[NUMBER] months",
  note: "[Write a short message about why she is special to you.]",
  letter: [
    "[Paragraph 1: how you feel about her and this month together.]",
    "[Paragraph 2: a favorite memory.]",
    "[Paragraph 3: what you look forward to.]"
  ],
  finalMessage: "Every day with you is another flower in our little garden."
};

const FLOWER_FILES = [
  "flowers/flower1.webp", "flowers/flower2.webp", "flowers/flower3.webp",
  "flowers/flower4.webp", "flowers/flower5.webp", "flowers/flower6.webp"
];

// ===== Fill the page from CONFIG =====
document.getElementById('greet').textContent = CONFIG.greeting;
document.getElementById('kicker').textContent = CONFIG.monthsaryDate + " · " + CONFIG.monthsCount;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('note').textContent = CONFIG.note;
document.getElementById('months').textContent = "Happy monthsary, " + CONFIG.herName + " ♥";
document.getElementById('final').textContent = CONFIG.finalMessage;
document.getElementById('fromLine').textContent = "From: " + CONFIG.myName;
document.getElementById('toLine').textContent = "To: " + CONFIG.herName;
document.getElementById('letterDate').textContent = "Date: " + CONFIG.monthsaryDate;
const body = document.getElementById('letterBody');
CONFIG.letter.forEach(t => { const p = document.createElement('p'); p.textContent = t; body.appendChild(p); });

// ===== Canvas =====
const cv = document.getElementById('fx');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const rnd = (a, b) => a + Math.random() * (b - a);

// ===== Sprites: remove the outer white/checkered background =====
function scaledSprite(img, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d', { willReadFrequently: true });
  const k = Math.min(size / img.width, size / img.height);
  const w = img.width * k, h = img.height * k;
  x.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
  try {
    const d = x.getImageData(0, 0, size, size);
    const px = d.data;
    const isBg = i => {
      const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      return mx > 190 && mx - mn < 28;
    };
    const seen = new Uint8Array(size * size);
    const stack = [];
    const addIfBg = i => { if (!seen[i] && isBg(i)) { seen[i] = 1; stack.push(i); } };
    for (let j = 0; j < size; j++) {
      addIfBg(j); addIfBg((size - 1) * size + j);
      addIfBg(j * size); addIfBg(j * size + size - 1);
    }
    while (stack.length) {
      const i = stack.pop();
      px[i * 4 + 3] = 0;
      const cx = i % size, cy = (i / size) | 0;
      if (cx > 0) addIfBg(i - 1);
      if (cx < size - 1) addIfBg(i + 1);
      if (cy > 0) addIfBg(i - size);
      if (cy < size - 1) addIfBg(i + size);
    }
    x.putImageData(d, 0, 0);
  } catch (e) { /* keep the image as-is if blocked */ }
  return c;
}
function petalSprite(color, r) {
  const c = document.createElement('canvas');
  const s = r * 2 + 4;
  c.width = c.height = s;
  const x = c.getContext('2d');
  x.translate(s / 2, s / 2);
  for (let i = 0; i < 5; i++) {
    x.rotate(Math.PI * 2 / 5);
    x.beginPath();
    x.ellipse(0, -r * 0.5, r * 0.32, r * 0.5, 0, 0, Math.PI * 2);
    x.fillStyle = color;
    x.fill();
  }
  return c;
}
const FALLBACK = [petalSprite('#e8557a', 14), petalSprite('#ff8fab', 22), petalSprite('#f5c2cf', 30)];
const IMG_SPRITES = [];
FLOWER_FILES.forEach(src => {
  const im = new Image();
  im.onload = () => { [90, 120, 150].forEach(sz => IMG_SPRITES.push(scaledSprite(im, sz))); };
  im.src = src;
});
const pick = () => {
  const list = IMG_SPRITES.length ? IMG_SPRITES : FALLBACK;
  return list[(Math.random() * list.length) | 0];
};

// ===== Water pile model =====
// The screen floor is split into columns. Each column stores how tall the pile is.
// A flower that lands raises its column, so the pile grows up the screen.
const BUCKET = 22;
let NB = 0, heights = null;
function initPile() {
  NB = Math.ceil(W / BUCKET) + 1;
  heights = new Float32Array(NB);
}
function colIndex(x) { return Math.max(0, Math.min(NB - 1, Math.floor(x / BUCKET))); }
function pileTop(x) { return H - heights[colIndex(x)]; }
function isFull() {
  let m = 0;
  for (let i = 0; i < NB; i++) if (heights[i] > m) m = heights[i];
  let m = Infinity; for (let i = 0; i < NB; i++) if (heights[i] < m) m = heights[i]; return m >= H * 0.9;
}

// ===== Particles =====
const FOUNTAIN_MS = 40000;
const MIN_FOUNTAIN_MS = 3000;
const MAX = 2400;
let parts = [];
let phase = 'idle';   // idle -> fountain -> boom -> done
let t0 = null, flash = 0, boomX = 0, boomY = 0;

function spawnJet(prog) {
  const k = Math.sqrt(H / 900);
  const jets = [W * 0.2, W * 0.5, W * 0.8];
  const fx = jets[(Math.random() * jets.length) | 0];
  const ang = -Math.PI / 2 + rnd(-0.35, 0.35);
  const sp = rnd(18, 24) * k * (0.9 + prog * 0.2);
  const img = pick();
  const target = rnd(0.6, 1.1);
  parts.push({
    state: 'air',
    x: fx + rnd(-14, 14), y: H - 6,
    vx: Math.cos(ang) * sp * 0.6, vy: Math.sin(ang) * sp,
    rot: rnd(0, 6.28), vr: rnd(-0.06, 0.06),
    s: 0.2, target, g: 0.35,
    half: img.height * target * 0.5,
    life: 1, decay: 0, drag: 1, img
  });
}

function land(p) {
  const idx = colIndex(p.x);
  const add = p.img.height * p.s * 1.0;
  p.state = 'rest';
  p.vx = 0; p.vy = 0; p.g = 0;
  p.y = pileTop(p.x) - p.img.height * p.s * 0.3;
  heights[idx] = Math.min(H * 0.95, heights[idx] + add);
  if (idx > 0) heights[idx - 1] = Math.min(H * 0.95, heights[idx - 1] + add * 0.5);
  if (idx < NB - 1) heights[idx + 1] = Math.min(H * 0.95, heights[idx + 1] + add * 0.5);
}

function startBoom() {
  phase = 'boom';
  boomX = W / 2; boomY = H * 0.45;
  parts.forEach(p => {
    if (p.state === 'fly') return;
    const dx = p.x - boomX, dy = p.y - boomY;
    const d = Math.hypot(dx, dy) || 1;
    const sp = rnd(8, 22);
    p.state = 'fly';
    p.vx = (dx / d) * sp + rnd(-1.5, 1.5);
    p.vy = (dy / d) * sp + rnd(-1.5, 1.5);
    p.g = 0.12; p.drag = 0.985;
    p.vr = rnd(-0.25, 0.25);
    p.s = p.target;
    p.decay = rnd(0.004, 0.008);
  });
  for (let i = 0; i < 140; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(6, 24);
    parts.push({
      state: 'fly', x: boomX, y: boomY,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      rot: rnd(0, 6.28), vr: rnd(-0.2, 0.2), s: rnd(0.4, 1.0), target: 1,
      g: 0.1, drag: 0.98, life: 1, decay: rnd(0.006, 0.012), img: pick()
    });
  }
  flash = 1;
  setTimeout(openAfterBoom, 1800);
}

function tick(now) {
  if (t0 === null) t0 = now;
  const t = now - t0;
  ctx.clearRect(0, 0, W, H);

  if (phase === 'fountain') {
    const prog = Math.min(1, t / FOUNTAIN_MS);
    const n = Math.floor(6 + prog * 14);
    for (let i = 0; i < n && parts.length < MAX; i++) spawnJet(prog);
    if ((t >= MIN_FOUNTAIN_MS && isFull()) || t >= FOUNTAIN_MS) startBoom();
  }

  for (const p of parts) {
    if (p.state === 'air') {
      p.vy += p.g;
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.995;
      p.rot += p.vr;
      if (p.s < p.target) p.s = Math.min(p.target, p.s + 0.08);
      if (p.vy > 0 && p.y + p.half >= pileTop(p.x)) land(p);
    } else if (p.state === 'fly') {
      p.x += p.vx; p.y += p.vy;
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.g;
      p.rot += p.vr;
      p.life -= p.decay;
    }
    if (p.life <= 0) continue;
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(p.s, p.s);
    ctx.drawImage(p.img, -p.img.width / 2, -p.img.height / 2);
    ctx.restore();
  }
  parts = parts.filter(p => p.life > 0 && (p.state !== 'fly' || (p.y > -200 && p.y < H + 200 && p.x > -200 && p.x < W + 200)));

  if (flash > 0.01) {
    const g = ctx.createRadialGradient(boomX, boomY, 0, boomX, boomY, Math.max(W, H) * 0.6);
    g.addColorStop(0, 'rgba(255,225,235,' + (flash * 0.5) + ')');
    g.addColorStop(1, 'rgba(255,225,235,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    flash *= 0.9;
  }

  if (phase !== 'idle' && (phase !== 'done' || parts.length || flash > 0.01)) {
    requestAnimationFrame(tick);
  }
}

// ===== Scene control =====
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const giftEl = document.getElementById('gift');
const giftScene = document.getElementById('gift-scene');
const scrap = document.getElementById('scrap');
const letter = document.getElementById('letter');

function showScrap() {
  giftScene.classList.add('gone');
  scrap.classList.add('show');
  scrap.setAttribute('aria-hidden', 'false');
}
function openAfterBoom() {
  phase = 'done';
  showScrap();
  letter.classList.add('show');
  cv.style.opacity = '0';
}

function start() {
  if (phase !== 'idle') return;
  giftEl.classList.add('open');
  document.getElementById('hint').style.display = 'none';
  if (reduced) {
    setTimeout(() => { showScrap(); letter.classList.add('show'); phase = 'done'; }, 700);
    return;
  }
  giftScene.classList.add('gone');
  initPile();
  phase = 'fountain';
  t0 = null;
  requestAnimationFrame(tick);
}
giftEl.addEventListener('click', start);

document.getElementById('openLetter').addEventListener('click', () => letter.classList.add('show'));
document.getElementById('closeLetter').addEventListener('click', () => letter.classList.remove('show'));
letter.addEventListener('click', e => { if (e.target === letter) letter.classList.remove('show'); });
document.getElementById('replay').addEventListener('click', () => location.reload());
</script>
</body>
</html>
