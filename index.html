<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For my favorite person</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#3B0710;color:#fbe9dc;font-family:"Cormorant Garamond",Georgia,serif;position:relative}
.script{font-family:"Great Vibes",cursive;font-weight:400}

/* Layer 1-4: the flower field */
#garden{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;pointer-events:none;z-index:1}
.flower{position:absolute;pointer-events:none}
.flower img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;
  animation:sway var(--dur,7s) ease-in-out var(--delay,0s) infinite alternate;transform-origin:50% 60%}
@keyframes sway{
  from{transform:rotate(calc(var(--rot) - 4deg)) translateY(0)}
  to{transform:rotate(calc(var(--rot) + 4deg)) translateY(-6px)}
}
.flower.pop{animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}

/* Layer 5: falling petals */
.petal{position:fixed;top:-60px;pointer-events:none;z-index:2;animation:fall linear infinite;opacity:.9}
@keyframes fall{
  from{transform:translate(0,-8vh) rotate(0deg)}
  to{transform:translate(28vw,118vh) rotate(540deg)}
}

/* soft dark veil so the greeting stays readable */
#veil{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at center,rgba(59,7,16,.6) 0%,rgba(59,7,16,.25) 55%,rgba(59,7,16,.05) 100%)}

/* Layer 6: greeting and gift */
#gift-scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;z-index:5;transition:opacity 1s ease}
#gift-scene.gone{opacity:0;pointer-events:none}
#greet{font-size:clamp(1.8rem,6vw,2.8rem);text-align:center;padding:0 1rem;text-shadow:0 2px 14px rgba(0,0,0,.6);opacity:0;animation:up 1.6s ease 3s forwards}
.gift{position:relative;width:min(44vw,180px);height:min(40vw,160px);background:none;border:0;cursor:pointer;animation:float 3.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent;pointer-events:auto;opacity:0;animation:float 3.2s ease-in-out infinite,up 1.2s ease 3.4s forwards}
.gift .base{position:absolute;left:0;bottom:0;width:100%;height:66%;background:linear-gradient(90deg,#a81f3a,#e0506f 50%,#a81f3a);border-radius:5px;box-shadow:0 14px 28px rgba(0,0,0,.45);transition:transform .8s ease}
.gift .lid{position:absolute;left:-5%;top:20%;width:110%;height:24%;background:linear-gradient(90deg,#c52d4d,#f4758f 50%,#c52d4d);border-radius:5px;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform 1s cubic-bezier(.3,1.5,.5,1),opacity .9s ease}
.rib{position:absolute;top:0;bottom:0;left:50%;width:14%;transform:translateX(-50%);background:#ffe3ea}
.gift .bow{position:absolute;top:-30%;left:50%;width:46%;height:52%;transform:translateX(-50%);transition:opacity .4s}
.bow span{position:absolute;top:0;width:50%;height:100%;border:7px solid #ffe3ea;border-radius:50%}
.bow span:first-child{left:0;transform:rotate(-30deg)}
.bow span:last-child{right:0;transform:rotate(30deg)}
.gift.open .lid{transform:translateY(-130px) rotate(-22deg);opacity:0}
.gift.open .base{transform:scale(.94)}
.gift.open .bow{opacity:0}
#hint{font-size:1rem;letter-spacing:.2em;text-transform:uppercase;opacity:0;animation:blink 2s ease-in-out 4s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* scrapbook and letter */
#scrap{position:fixed;inset:0;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity 1.6s ease;z-index:4;background:radial-gradient(ellipse at 50% 30%,#8a2234 0%,#4a0c16 70%,#2c060d 100%)}
#scrap.show{opacity:1;pointer-events:auto}
.scrap-inner{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:3rem 1.2rem 5rem;gap:1.6rem}
.kicker{font-size:1rem;letter-spacing:.25em;text-transform:uppercase;color:#f5c2cf;text-align:center}
.title{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(3rem,10vw,5.5rem);line-height:1.05;text-align:center;color:#fff1e6;text-shadow:0 0 18px rgba(255,143,171,.35)}
.paper{position:relative;background:#f7ead5;color:#4a1420;padding:1.4rem 1.3rem 1.6rem;width:min(86vw,380px);box-shadow:0 12px 26px rgba(0,0,0,.4)}
.note-text{font-style:italic;font-size:1.25rem;line-height:1.5;margin:.6rem 0}
.final{font-family:"Great Vibes",cursive;font-size:clamp(1.8rem,5vw,2.4rem);text-align:center;color:#ffd6e0;max-width:560px;line-height:1.3}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
.btn{font:inherit;font-style:italic;font-size:1.1rem;color:#fff;background:#b8243f;border:0;padding:.7rem 1.5rem;border-radius:999px;cursor:pointer;text-decoration:none;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.btn.ghost{background:transparent;border:1px solid #f5c2cf}
#letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,2,6,.6);z-index:20;padding:1.2rem}
#letter.show{display:flex}
.letter-paper{position:relative;background:#f8eedb;color:#3e1220;width:min(92vw,560px);max-height:88vh;overflow-y:auto;padding:2rem 1.8rem;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:unfold .9s ease both}
@keyframes unfold{from{opacity:0;transform:translateY(30px) rotate(-1deg)}to{opacity:1;transform:none}}
.letter-paper .from{font-style:italic;font-size:1.05rem}
.letter-paper .to{font-family:"Great Vibes",cursive;font-size:2.2rem;margin:.6rem 0}
.letter-paper p{font-size:1.15rem;line-height:1.7;margin-bottom:1rem}
.letter-close{position:absolute;top:.5rem;right:.8rem;background:none;border:0;font-size:1.8rem;color:#7a2a3a;cursor:pointer}

@media (prefers-reduced-motion: reduce){
  .flower img,.petal,.gift,#hint{animation:none !important}
  .flower.pop{animation:none}
}
</style>
</head>
<body>

<div id="garden"></div>
<div id="veil"></div>
<div id="petals"></div>

<section id="gift-scene">
  <p id="greet" class="script"></p>
  <button id="gift" class="gift" aria-label="Open your gift">
    <div class="lid"><div class="rib"></div></div>
    <div class="base"><div class="rib"></div></div>
    <div class="bow"><span></span><span></span></div>
  </button>
  <p id="hint">Tap the gift</p>
</section>

<section id="scrap" aria-hidden="true">
  <div class="scrap-inner">
    <p class="kicker" id="kicker"></p>
    <h2 class="title" id="title"></h2>
    <div class="paper">
      <p class="note-text" id="note"></p>
      <p class="note-text" id="months"></p>
    </div>
    <p class="final" id="final"></p>
    <div class="actions">
      <button class="btn" id="openLetter">Read my letter</button>
      <a class="btn ghost" href="flower.html">Our garden</a>
      <button class="btn ghost" id="replay">Replay</button>
    </div>
  </div>
</section>

<div id="letter">
  <div class="letter-paper">
    <button class="letter-close" id="closeLetter" aria-label="Close">×</button>
    <p class="from" id="fromLine"></p>
    <p class="to" id="toLine"></p>
    <div id="letterBody"></div>
    <p class="from" id="letterDate"></p>
  </div>
</div>

<script>
// ===== EDIT YOUR PERSONAL CONTENT HERE =====
const CONFIG = {
  myName: "[MY NAME]",
  herName: "[HER NAME]",
  greeting: "For my favorite person...",
  title: "My Favorite Person",
  monthsaryDate: "[OUR MONTHSARY DATE]",
  monthsCount: "[NUMBER] months",
  note: "[Write a short message about why she is special to you.]",
  letter: [
    "[Paragraph 1: how you feel about her and this month together.]",
    "[Paragraph 2: a favorite memory.]",
    "[Paragraph 3: what you look forward to.]"
  ],
  finalMessage: "Every day with you is another flower in our little garden."
};

// Flower images saved in the flowers folder
const FLOWER_FILES = [
  "flowers/flower1.webp", "flowers/flower2.webp", "flowers/flower3.webp",
  "flowers/flower4.webp", "flowers/flower5.webp", "flowers/flower6.webp"
];

// ===== Fill text from CONFIG =====
document.getElementById('greet').textContent = CONFIG.greeting;
document.getElementById('kicker').textContent = CONFIG.monthsaryDate + " · " + CONFIG.monthsCount;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('note').textContent = CONFIG.note;
document.getElementById('months').textContent = "Happy monthsary, " + CONFIG.herName + " ♥";
document.getElementById('final').textContent = CONFIG.finalMessage;
document.getElementById('fromLine').textContent = "From: " + CONFIG.myName;
document.getElementById('toLine').textContent = "To: " + CONFIG.herName;
document.getElementById('letterDate').textContent = "Date: " + CONFIG.monthsaryDate;
CONFIG.letter.forEach(t => {
  const p = document.createElement('p');
  p.textContent = t;
  document.getElementById('letterBody').appendChild(p);
});

// ===== Setup =====
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const garden = document.getElementById('garden');
const petalBox = document.getElementById('petals');
const veil = document.getElementById('veil');
const giftEl = document.getElementById('gift');
const giftScene = document.getElementById('gift-scene');
const scrap = document.getElementById('scrap');
const letter = document.getElementById('letter');

let sprites = [];
let wraps = [];
let booted = false;
let exploded = false;
let resizeTimer = null;

const rand = (a, b) => a + Math.random() * (b - a);
const pick = () => sprites[(Math.random() * sprites.length) | 0];

// ===== Remove the white/checkered background from each flower =====
function loadImage(src) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}
function cutoutURL(img) {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d', { willReadFrequently: true });
  const k = Math.min(S / img.naturalWidth, S / img.naturalHeight);
  const w = img.naturalWidth * k, h = img.naturalHeight * k;
  x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
  try {
    const d = x.getImageData(0, 0, S, S);
    const px = d.data;
    const isBg = i => {
      const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      return mx > 200 && mx - mn < 30;
    };
    const seen = new Uint8Array(S * S);
    const stack = [];
    const add = i => { if (!seen[i] && isBg(i)) { seen[i] = 1; stack.push(i); } };
    for (let j = 0; j < S; j++) {
      add(j); add((S - 1) * S + j); add(j * S); add(j * S + S - 1);
    }
    while (stack.length) {
      const i = stack.pop();
      px[i * 4 + 3] = 0;
      const cx = i % S, cy = (i / S) | 0;
      if (cx > 0) add(i - 1);
      if (cx < S - 1) add(i + 1);
      if (cy > 0) add(i - S);
      if (cy < S - 1) add(i + S);
    }
    x.putImageData(d, 0, 0);
  } catch (e) { /* keep original if the browser blocks it */ }
  return c.toDataURL('image/png');
}
function petalURL(color) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  x.translate(32, 32);
  for (let i = 0; i < 5; i++) {
    x.rotate(Math.PI * 2 / 5);
    x.beginPath();
    x.ellipse(0, -16, 10, 16, 0, 0, Math.PI * 2);
    x.fillStyle = color;
    x.fill();
  }
  return c.toDataURL('image/png');
}
async function getSprites() {
  const loaded = (await Promise.all(FLOWER_FILES.map(loadImage))).filter(Boolean);
  const cut = loaded.map(im => { try { return cutoutURL(im); } catch (e) { return im.src; } });
  const ready = (await Promise.all(cut.map(loadImage))).filter(Boolean);
  if (!ready.length) return [petalURL('#e8557a'), petalURL('#ff8fab'), petalURL('#f5c2cf')];
  return ready.map(i => i.src);
}

// ===== Build the flower field: edges and corners included =====
function build(intro) {
  garden.innerHTML = '';
  wraps = [];
  const W = window.innerWidth, H = window.innerHeight;
  const cell = Math.max(80, Math.min(W, H) / 7);
  const cols = Math.ceil(W / cell) + 2;
  const rows = Math.ceil(H / cell) + 2;
  const cx = W / 2, cy = H / 2;
  const maxD = Math.hypot(cx, cy) || 1;

  const small = [], big = [];
  for (let r = -1; r < rows - 1; r++) {
    for (let c = -1; c < cols - 1; c++) {
      const ox = (c + 0.5) * cell + rand(-0.35, 0.35) * cell;
      const oy = (r + 0.5) * cell + rand(-0.35, 0.35) * cell;
      small.push({ ox, oy, size: cell * rand(1.25, 1.6), z: 2, op: rand(0.8, 0.95) });
      if (Math.random() < 0.7) {
        big.push({ ox: ox + rand(-0.2, 0.2) * cell, oy: oy + rand(-0.2, 0.2) * cell,
                   size: cell * rand(1.7, 2.2), z: 3, op: 1 });
      }
    }
  }

  [...small, ...big].forEach(it => {
    const dx = it.ox - cx, dy = it.oy - cy;
    const dist = Math.hypot(dx, dy) / maxD;   // 0 = center, 1 = corner

    const wrap = document.createElement('div');
    wrap.className = 'flower';
    wrap.style.cssText = `left:${it.ox - it.size / 2}px;top:${it.oy - it.size / 2}px;width:${it.size}px;height:${it.size}px;z-index:${it.z}`;
    wrap._dx = dx; wrap._dy = dy; wrap._d = dist;

    const img = document.createElement('img');
    img.src = pick();
    img.alt = '';
    img.draggable = false;
    const rot = rand(-45, 45);
    img.style.setProperty('--rot', rot + 'deg');
    img.style.setProperty('--dur', rand(5, 9).toFixed(2) + 's');
    img.style.setProperty('--delay', (-rand(0, 8)).toFixed(2) + 's');
    img.style.opacity = it.op;
    wrap.appendChild(img);
    garden.appendChild(wrap);
    wraps.push(wrap);

    if (intro) {
      // edges arrive first, flowers fly in toward the center
      const delay = (1 - dist) * 1500 + rand(0, 600);
      wrap.animate([
        { transform: `translate(${dx * 1.3}px, ${dy * 1.3}px) scale(0.25) rotate(${rand(-180, 180)}deg)`, opacity: 0 },
        { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 }
      ], { duration: rand(1100, 1700), delay, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    }
  });
}

// ===== Falling petals =====
function makePetals() {
  petalBox.innerHTML = '';
  if (reduced) return;
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('img');
    p.className = 'petal';
    p.src = pick();
    p.alt = '';
    p.style.width = rand(22, 40) + 'px';
    p.style.left = rand(-10, 90) + 'vw';
    p.style.animationDuration = rand(10, 18).toFixed(2) + 's';
    p.style.animationDelay = (-rand(0, 18)).toFixed(2) + 's';
    petalBox.appendChild(p);
  }
}

// ===== Occasional small bloom on a random flower =====
setInterval(() => {
  if (exploded || reduced || !wraps.length) return;
  const w = wraps[(Math.random() * wraps.length) | 0];
  w.classList.remove('pop');
  void w.offsetWidth;
  w.classList.add('pop');
}, 2200);

// ===== Gift tap: flowers burst outward from the center =====
function explode() {
  exploded = true;
  wraps.forEach(w => {
    w.classList.remove('pop');
    w.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${w._dx * 2.6}px, ${w._dy * 2.6}px) scale(1.5)`, opacity: 0 }
    ], { duration: rand(1100, 1700), delay: w._d * 400 + rand(0, 250),
         easing: 'cubic-bezier(.4,0,.9,.6)', fill: 'forwards' });
  });
  veil.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1400, fill: 'forwards' });
}

function showScrap() {
  giftScene.classList.add('gone');
  scrap.classList.add('show');
  scrap.setAttribute('aria-hidden', 'false');
}

function start() {
  if (!booted || exploded) return;
  giftEl.classList.add('open');
  document.getElementById('hint').style.display = 'none';
  if (reduced) {
    exploded = true;
    setTimeout(() => { showScrap(); letter.classList.add('show'); }, 700);
    return;
  }
  explode();
  setTimeout(() => giftScene.classList.add('gone'), 900);
  setTimeout(() => { showScrap(); letter.classList.add('show'); }, 2300);
}

// ===== Boot =====
getSprites().then(s => {
  sprites = s;
  build(!reduced);     // intro burst on load
  makePetals();
  booted = true;
});

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (booted && !exploded) build(false); }, 300);
});

giftEl.addEventListener('click', start);
document.getElementById('openLetter').addEventListener('click', () => letter.classList.add('show'));
document.getElementById('closeLetter').addEventListener('click', () => letter.classList.remove('show'));
letter.addEventListener('click', e => { if (e.target === letter) letter.classList.remove('show'); });
document.getElementById('replay').addEventListener('click', () => location.reload());
</script>
</body>
</html>
