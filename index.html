<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For my favorite person</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#3e0a12;color:#fbe9dc;font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden}
.script{font-family:"Great Vibes",cursive;font-weight:400}

#gift-scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;background:radial-gradient(ellipse at center,#7a1a29 0%,#4a0c16 60%,#2c060d 100%);z-index:4;transition:opacity 1.2s ease}
#gift-scene.gone{opacity:0;pointer-events:none}
#greet{font-size:clamp(1.8rem,6vw,2.8rem);text-align:center;padding:0 1rem;opacity:0;animation:up 1.6s ease .3s forwards}
.gift{position:relative;width:min(44vw,180px);height:min(40vw,160px);background:none;border:0;cursor:pointer;animation:float 3.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.gift .base{position:absolute;left:0;bottom:0;width:100%;height:66%;background:linear-gradient(90deg,#a81f3a,#e0506f 50%,#a81f3a);border-radius:5px;box-shadow:0 14px 28px rgba(0,0,0,.45);transition:transform .8s ease}
.gift .lid{position:absolute;left:-5%;top:20%;width:110%;height:24%;background:linear-gradient(90deg,#c52d4d,#f4758f 50%,#c52d4d);border-radius:5px;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform 1s cubic-bezier(.3,1.5,.5,1),opacity .9s ease}
.rib{position:absolute;top:0;bottom:0;left:50%;width:14%;transform:translateX(-50%);background:#ffe3ea}
.gift .bow{position:absolute;top:-30%;left:50%;width:46%;height:52%;transform:translateX(-50%);transition:opacity .4s}
.bow span{position:absolute;top:0;width:50%;height:100%;border:7px solid #ffe3ea;border-radius:50%}
.bow span:first-child{left:0;transform:rotate(-30deg)}
.bow span:last-child{right:0;transform:rotate(30deg)}
.gift.open .lid{transform:translateY(-130px) rotate(-22deg);opacity:0}
.gift.open .base{transform:scale(.94)}
.gift.open .bow{opacity:0}
#hint{font-size:1rem;letter-spacing:.2em;text-transform:uppercase;animation:blink 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

#scrap{position:fixed;inset:0;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity 1.6s ease;z-index:3;background:radial-gradient(ellipse at 50% 30%,#8a2234 0%,#4a0c16 70%,#2c060d 100%)}
#scrap.show{opacity:1;pointer-events:auto}
.scrap-inner{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:3rem 1.2rem 5rem;gap:1.6rem}
.reveal{opacity:0;transform:translateY(24px)}
#scrap.show .reveal{animation:up 1.2s ease forwards}
#scrap.show .d1{animation-delay:.4s}
#scrap.show .d2{animation-delay:.8s}
#scrap.show .d3{animation-delay:1.2s}
#scrap.show .d4{animation-delay:1.6s}
.kicker{font-size:1rem;letter-spacing:.25em;text-transform:uppercase;color:#f5c2cf;text-align:center}
.title{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(3rem,10vw,5.5rem);line-height:1.05;text-align:center;color:#fff1e6;text-shadow:0 0 18px rgba(255,143,171,.35)}
.collage{display:flex;flex-direction:column;align-items:center;gap:1.8rem;width:100%;max-width:820px;position:relative}
@media(min-width:720px){.collage{flex-direction:row;justify-content:center;align-items:flex-start}}
.paper{position:relative;background:#f7ead5;color:#4a1420;padding:1.4rem 1.3rem 1.6rem;width:min(86vw,380px);box-shadow:0 12px 26px rgba(0,0,0,.4);background-image:radial-gradient(rgba(120,70,40,.07) 1px,transparent 1px);background-size:6px 6px}
.paper.a{transform:rotate(-2.5deg)}
.paper.b{transform:rotate(2deg)}
.tape{position:absolute;top:-12px;left:50%;width:90px;height:26px;transform:translateX(-50%) rotate(-4deg);background:rgba(255,236,200,.7);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.6rem}
.photo{background:#fff;padding:7px 7px 22px;box-shadow:0 4px 10px rgba(0,0,0,.25);transform:rotate(-2deg)}
.photo:nth-child(2){transform:rotate(3deg)}
.photo img,.photo .ph{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#e9c8d0}
.photo .ph{display:flex;align-items:center;justify-content:center;text-align:center;font-size:.85rem;color:#8a4a58;padding:.4rem}
.note-text{font-style:italic;font-size:1.25rem;line-height:1.5;margin:.6rem 0}
.deco{position:absolute;color:#f5c2cf;font-size:2rem;text-shadow:0 0 10px rgba(255,143,171,.6);pointer-events:none}
.final{font-family:"Great Vibes",cursive;font-size:clamp(1.8rem,5vw,2.4rem);text-align:center;color:#ffd6e0;max-width:560px;line-height:1.3}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
.btn{font:inherit;font-style:italic;font-size:1.1rem;color:#fff;background:#b8243f;border:0;padding:.7rem 1.5rem;border-radius:999px;cursor:pointer;text-decoration:none;box-shadow:0 8px 18px rgba(0,0,0,.35);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid #f5c2cf}

#letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,2,6,.75);z-index:20;padding:1.2rem}
#letter.show{display:flex}
.letter-paper{position:relative;background:#f8eedb;color:#3e1220;width:min(92vw,560px);max-height:88vh;overflow-y:auto;padding:2rem 1.8rem;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:unfold .9s ease both}
@keyframes unfold{from{opacity:0;transform:translateY(30px) rotate(-1deg)}to{opacity:1;transform:none}}
.letter-paper .from{font-style:italic;font-size:1.05rem}
.letter-paper .to{font-family:"Great Vibes",cursive;font-size:2.2rem;margin:.6rem 0}
.letter-paper p{font-size:1.15rem;line-height:1.7;margin-bottom:1rem}
.letter-close{position:absolute;top:.5rem;right:.8rem;background:none;border:0;font-size:1.8rem;color:#7a2a3a;cursor:pointer}
</style>
</head>
<body>

<section id="gift-scene">
  <p id="greet" class="script"></p>
  <button id="gift" class="gift" aria-label="Open your gift">
    <div class="lid"><div class="rib"></div></div>
    <div class="base"><div class="rib"></div></div>
    <div class="bow"><span></span><span></span></div>
  </button>
  <p id="hint">Tap the gift</p>
</section>

<canvas id="fx"></canvas>

<section id="scrap" aria-hidden="true">
  <div class="scrap-inner">
    <p class="kicker reveal" id="kicker"></p>
    <h2 class="title reveal d1" id="title"></h2>
    <div class="collage reveal d2">
      <div class="paper a">
        <div class="tape"></div>
        <div class="photos" id="photos"></div>
      </div>
      <div class="paper b">
        <div class="tape"></div>
        <p class="note-text" id="note"></p>
        <p class="note-text" id="months"></p>
      </div>
      <span class="deco" style="left:-8px;top:-22px">✦</span>
      <span class="deco" style="right:-8px;bottom:-22px">✦</span>
    </div>
    <p class="final reveal d3" id="final"></p>
    <div class="actions reveal d4">
      <button class="btn" id="openLetter">Read my letter</button>
      <a class="btn ghost" href="flower.html">Our garden</a>
      <button class="btn ghost" id="replay">Replay</button>
    </div>
  </div>
</section>

<div id="letter">
  <div class="letter-paper">
    <button class="letter-close" id="closeLetter" aria-label="Close">×</button>
    <p class="from" id="fromLine"></p>
    <p class="to" id="toLine"></p>
    <div id="letterBody"></div>
    <p class="from" id="letterDate"></p>
  </div>
</div>

<script>
// ===== EDIT YOUR PERSONAL CONTENT HERE =====
const CONFIG = {
  myName: "[MY NAME]",
  herName: "[HER NAME]",
  greeting: "For my favorite person...",
  title: "My Favorite Person",
  monthsaryDate: "[OUR MONTHSARY DATE]",
  monthsCount: "[NUMBER] months",
  note: "[Write a short message about why she is special to you.]",
  letter: [
    "[Paragraph 1: how you feel about her and this month together.]",
    "[Paragraph 2: a favorite memory.]",
    "[Paragraph 3: what you look forward to.]"
  ],
  finalMessage: "Every day with you is another flower in our little garden.",
  photos: []   // add image links here, e.g. "https://example.com/photo1.jpg"
};

// ===== Fill the page from CONFIG =====
document.getElementById('greet').textContent = CONFIG.greeting;
document.getElementById('kicker').textContent = CONFIG.monthsaryDate + " · " + CONFIG.monthsCount;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('note').textContent = CONFIG.note;
document.getElementById('months').textContent = "Happy monthsary, " + CONFIG.herName + " ♥";
document.getElementById('final').textContent = CONFIG.finalMessage;
document.getElementById('fromLine').textContent = "From: " + CONFIG.myName;
document.getElementById('toLine').textContent = "To: " + CONFIG.herName;
document.getElementById('letterDate').textContent = "Date: " + CONFIG.monthsaryDate;
const body = document.getElementById('letterBody');
CONFIG.letter.forEach(t => { const p = document.createElement('p'); p.textContent = t; body.appendChild(p); });

const photoBox = document.getElementById('photos');
const photoList = CONFIG.photos.length ? CONFIG.photos : ['Photo 1', 'Photo 2'];
photoList.forEach((src, i) => {
  const frame = document.createElement('div');
  frame.className = 'photo';
  if (CONFIG.photos.length) {
    const img = document.createElement('img');
    img.src = src; img.alt = 'Memory ' + (i + 1);
    frame.appendChild(img);
  } else {
    const d = document.createElement('div');
    d.className = 'ph';
    d.textContent = src + ' (add your photo in CONFIG)';
    frame.appendChild(d);
  }
  photoBox.appendChild(frame);
});

// ===== Flower particle storm =====
const cv = document.getElementById('fx');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const COLORS = ['#e8557a', '#ff8fab', '#f5c2cf', '#c2375a', '#fbe3e8', '#ffb3c6'];
function petalSprite(color, r) {
  const c = document.createElement('canvas');
  const s = r * 2 + 4;
  c.width = c.height = s;
  const x = c.getContext('2d');
  x.translate(s / 2, s / 2);
  for (let i = 0; i < 5; i++) {
    x.rotate(Math.PI * 2 / 5);
    x.beginPath();
    x.ellipse(0, -r * 0.5, r * 0.32, r * 0.5, 0, 0, Math.PI * 2);
    x.fillStyle = color;
    x.fill();
  }
  x.beginPath();
  x.arc(0, 0, r * 0.22, 0, Math.PI * 2);
  x.fillStyle = '#ffd166';
  x.fill();
  return c;
}
const SPRITES = [];
COLORS.forEach(col => [8, 14, 22, 32].forEach(r => SPRITES.push(petalSprite(col, r))));
const pick = () => SPRITES[(Math.random() * SPRITES.length) | 0];

let parts = [];
const MAX = 650;
const STORM_MS = 4800;
let storming = false, t0 = null, flash = 0, burstX = 0, burstY = 0;

function add(o) {
  parts.push(Object.assign({
    x: 0, y: 0, vx: 0, vy: 0, rot: rnd(0, 6.28), vr: rnd(-0.03, 0.03),
    s: 1, target: 1, g: 0, drag: 1, life: 1, decay: 0, img: pick()
  }, o));
}
function spawnEdge() {
  const m = 60, side = (Math.random() * 4) | 0;
  let x, y, vx, vy;
  if (side === 0) { x = rnd(0, W); y = -m; vx = rnd(-1, 1); vy = rnd(2, 5); }
  else if (side === 1) { x = rnd(0, W); y = H + m; vx = rnd(-1, 1); vy = rnd(-5, -2); }
  else if (side === 2) { x = -m; y = rnd(0, H); vx = rnd(2, 5); vy = rnd(-1, 1); }
  else { x = W + m; y = rnd(0, H); vx = rnd(-5, -2); vy = rnd(-1, 1); }
  const sc = rnd(0.5, 1.3);
  add({ x, y, vx, vy, s: sc, target: sc, drag: 0.985 });
}
function spawnInside() {
  const sc = rnd(0.5, 1.3);
  add({ x: rnd(0, W), y: rnd(0, H), vx: rnd(-0.4, 0.4), vy: rnd(-0.2, 0.6), s: 0, target: sc, drag: 0.98 });
}
function explode() {
  burstX = W / 2; burstY = H * 0.42;
  parts.forEach(p => { p.decay = 0.006; p.g = 0; });
  for (let i = 0; i < 240; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(4, 16), sc = rnd(0.35, 1);
    add({ x: burstX, y: burstY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: sc, target: sc,
          vr: rnd(-0.2, 0.2), drag: 0.965, g: 0.035, decay: rnd(0.008, 0.014) });
  }
  for (let i = 0; i < 16; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(3, 7), sc = rnd(1.4, 2.2);
    add({ x: burstX, y: burstY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: sc, target: sc,
          vr: rnd(-0.1, 0.1), drag: 0.975, g: 0.02, decay: 0.004 });
  }
  flash = 1;
}
const offscreen = p => p.x < -150 || p.x > W + 150 || p.y < -150 || p.y > H + 150;

function tick(now) {
  if (t0 === null) t0 = now;
  const t = now - t0;
  ctx.clearRect(0, 0, W, H);

  if (storming) {
    const prog = Math.min(1, t / STORM_MS);
    const n = Math.floor(1 + prog * prog * 10 + Math.random() * 1.5);
    for (let i = 0; i < n; i++) Math.random() < 0.5 ? spawnEdge() : spawnInside();
    if (parts.length > MAX) parts.splice(0, parts.length - MAX);
    if (t >= STORM_MS) {
      storming = false;
      explode();
      setTimeout(reveal, 1500);
    }
  }

  if (flash > 0.01) {
    const g = ctx.createRadialGradient(burstX, burstY, 0, burstX, burstY, Math.max(W, H) * 0.5);
    g.addColorStop(0, 'rgba(255,220,230,' + (flash * 0.6) + ')');
    g.addColorStop(1, 'rgba(255,220,230,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    flash *= 0.92;
  }

  for (const p of parts) {
    p.x += p.vx; p.y += p.vy;
    p.vx *= p.drag;
    p.vy = p.vy * p.drag + p.g;
    p.rot += p.vr;
    if (p.s < p.target) p.s = Math.min(p.target, p.s + 0.05);
    p.life -= p.decay;
    if (p.life <= 0) continue;
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(p.s, p.s);
    ctx.drawImage(p.img, -p.img.width / 2, -p.img.height / 2);
    ctx.restore();
  }
  parts = parts.filter(p => p.life > 0 && (storming || !offscreen(p)));

  if (storming || parts.length || flash > 0.01) requestAnimationFrame(tick);
}

// ===== Scene control =====
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const giftEl = document.getElementById('gift');
const giftScene = document.getElementById('gift-scene');
const scrap = document.getElementById('scrap');
let started = false;

function reveal() {
  giftScene.classList.add('gone');
  scrap.classList.add('show');
  scrap.setAttribute('aria-hidden', 'false');
}

function start() {
  if (started) return;
  started = true;
  giftEl.classList.add('open');
  document.getElementById('hint').style.display = 'none';
  if (reduced) { setTimeout(reveal, 900); return; }
  storming = true;
  t0 = null;
  requestAnimationFrame(tick);
}
giftEl.addEventListener('click', start);

const letter = document.getElementById('letter');
document.getElementById('openLetter').addEventListener('click', () => letter.classList.add('show'));
document.getElementById('closeLetter').addEventListener('click', () => letter.classList.remove('show'));
letter.addEventListener('click', e => { if (e.target === letter) letter.classList.remove('show'); });
document.getElementById('replay').addEventListener('click', () => location.reload());
</script>
</body>
</html>
