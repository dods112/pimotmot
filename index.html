<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B0710">
<title>For my favorite person</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--burg:#3B0710;--wine:#641525;--rose:#C42648;--ivory:#FFF6E8;--blush:#F5B9C5;--gold:#D8B16A;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 40%,var(--wine) 0%,var(--burg) 65%,#220308 100%);color:var(--ivory);font-family:"Cormorant Garamond",Georgia,serif;min-height:100dvh}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#glow{z-index:0;background:radial-gradient(circle at 50% 45%,rgba(196,38,72,.35),transparent 60%);opacity:0;transition:opacity 3s ease}
body.ready #glow{opacity:1}
#garden{z-index:1}
#petals{z-index:2}

/* Flowers: real cutouts, no filters, full opacity. Never block input. */
.flower{position:absolute;pointer-events:none}
.flower img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;transform-origin:50% 60%}
.flower img.sway{animation:sway var(--dur,8s) ease-in-out var(--delay,0s) infinite alternate}
.flower.drift{animation:drift var(--ddur,34s) linear var(--ddelay,0s) infinite}
@keyframes sway{from{transform:rotate(calc(var(--rot) - 3deg))}to{transform:rotate(calc(var(--rot) + 3deg))}}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(var(--dx,30px),var(--dy,-24px))}100%{transform:translate(0,0)}}
.petal{position:absolute;top:-60px;width:26px;height:auto;animation:fall linear infinite;opacity:.85}
@keyframes fall{from{transform:translate(0,-8vh) rotate(0deg)}to{transform:translate(24vw,118vh) rotate(540deg)}}
.bp{position:absolute;width:44px;height:44px;object-fit:contain;pointer-events:none}

/* Gift opening */
#giftScene{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:calc(1rem + var(--safe-t)) 1rem calc(1rem + var(--safe-b));transition:opacity 1.2s ease}
#giftScene.gone{opacity:0;pointer-events:none}
#giftGreet{font-family:"Great Vibes",cursive;font-size:clamp(1.7rem,7vw,2.8rem);text-align:center;color:var(--ivory);text-shadow:0 2px 14px rgba(0,0,0,.6);line-height:1.2}
.gift{position:relative;width:min(44vw,180px);height:min(40vw,160px);min-width:120px;min-height:110px;background:none;border:0;cursor:pointer;animation:float 3.2s ease-in-out infinite}
.gift .base{position:absolute;left:0;bottom:0;width:100%;height:66%;background:linear-gradient(90deg,#a81f3a,#e0506f 50%,#a81f3a);border-radius:5px;box-shadow:0 14px 28px rgba(0,0,0,.45);transition:transform .8s ease}
.gift .lid{position:absolute;left:-5%;top:20%;width:110%;height:24%;background:linear-gradient(90deg,#c52d4d,#f4758f 50%,#c52d4d);border-radius:5px;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform 1s cubic-bezier(.3,1.5,.5,1),opacity .9s ease}
.rib{position:absolute;top:0;bottom:0;left:50%;width:14%;transform:translateX(-50%);background:#ffe3ea}
.gift .bow{position:absolute;top:-30%;left:50%;width:46%;height:52%;transform:translateX(-50%);transition:opacity .4s}
.bow span{position:absolute;top:0;width:50%;height:100%;border:7px solid #ffe3ea;border-radius:50%}
.bow span:first-child{left:0;transform:rotate(-30deg)}
.bow span:last-child{right:0;transform:rotate(30deg)}
.gift.open .lid{transform:translateY(-130px) rotate(-22deg);opacity:0}
.gift.open .base{transform:scale(.94)}
.gift.open .bow{opacity:0}
.gift:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
#hint{font-size:clamp(.85rem,3.5vw,1rem);letter-spacing:.2em;text-transform:uppercase;color:var(--blush);animation:blink 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}

/* Hero */
#hero{position:fixed;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(1.2rem + var(--safe-t)) 1rem calc(1.2rem + var(--safe-b));visibility:hidden;pointer-events:none}
body.revealed #hero{visibility:visible;pointer-events:auto}
#heroInner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;text-align:center;padding-top:2.5rem}
.rv{opacity:0;transform:translateY(16px);transition:opacity 1.4s ease var(--d,0s),transform 1.4s ease var(--d,0s)}
body.revealed .rv{opacity:1;transform:none}
.kicker{font-size:clamp(.75rem,2.8vw,1rem);letter-spacing:.25em;text-transform:uppercase;color:var(--blush);text-shadow:0 1px 8px rgba(0,0,0,.7)}
.heading{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.4rem,10vw,5.2rem);line-height:1.1;color:var(--ivory);text-shadow:0 0 18px rgba(245,185,197,.45),0 2px 14px rgba(0,0,0,.6);overflow-wrap:break-word;max-width:100%}
.card{position:relative;background:linear-gradient(160deg,#fff7e8,#f5e4c6);color:#4a1420;width:min(90vw,440px);padding:1.4rem 1.5rem 1.7rem;border-radius:6px 6px 10px 10px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.card .for{font-style:italic;font-size:clamp(1rem,3.8vw,1.1rem);margin-bottom:.4rem}
.card .msg{font-size:clamp(1.05rem,4vw,1.2rem);line-height:1.6;overflow-wrap:break-word}
.seal{position:absolute;right:14px;bottom:-14px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e0506f,#8a1630);color:var(--ivory);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 4px 10px rgba(0,0,0,.35);pointer-events:none}
.quote{font-family:"Great Vibes",cursive;font-size:clamp(1.5rem,6.5vw,2.2rem);line-height:1.35;max-width:600px;color:var(--ivory);text-shadow:0 2px 12px rgba(0,0,0,.7);padding:0 .4rem}
.btns{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:.4rem;max-width:100%}
.btn{color:#fff;background:var(--rose);border:0;min-height:44px;padding:.65rem 1.4rem;border-radius:999px;font-style:italic;font-size:clamp(1rem,3.8vw,1.1rem);box-shadow:0 8px 18px rgba(0,0,0,.35);white-space:nowrap}
.btn.ghost{background:rgba(59,7,16,.6);border:1px solid var(--gold);color:var(--ivory)}
.btn:focus-visible,.tab:focus-visible,.nav:focus-visible,.mclose:focus-visible,.close:focus-visible,.gback:focus-visible,.mem:focus-visible,.tl-item:focus-visible,#musicBtn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#musicBtn{position:fixed;top:calc(.8rem + var(--safe-t));right:calc(.8rem + env(safe-area-inset-right,0px));z-index:40;background:rgba(59,7,16,.7);color:var(--ivory);border:1px solid var(--gold);min-height:40px;padding:.35rem .9rem;border-radius:999px;font-style:italic;font-size:.95rem}

/* Letter */
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(40,4,12,.62);padding:calc(.6rem + var(--safe-t)) .6rem calc(.6rem + var(--safe-b))}
.overlay.show{display:flex}
.sheet{position:relative;background:linear-gradient(#fff7e8,#f7e7cc);color:#3e1220;width:min(92vw,560px);max-height:calc(100dvh - 2rem - var(--safe-t) - var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2.2rem 1.6rem;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:unfold .9s ease both}
@keyframes unfold{from{opacity:0;transform:translateY(30px) rotate(-1deg)}to{opacity:1;transform:none}}
.sheet .from{font-style:italic;font-size:1.02rem}
.sheet .to{font-family:"Great Vibes",cursive;font-size:clamp(1.8rem,7vw,2.2rem);margin:.4rem 0 .8rem}
.letter-text{white-space:pre-wrap;font-size:clamp(1.05rem,4vw,1.15rem);line-height:1.75;min-height:6rem;overflow-wrap:break-word}
.close{position:absolute;top:.2rem;right:.4rem;width:44px;height:44px;background:none;border:0;font-size:2rem;color:#7a2a3a;display:flex;align-items:center;justify-content:center}

/* Memories */
#gardenView{background:rgba(40,4,12,.35);align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
#gardenView.show{display:flex}
.gbox{width:min(96vw,1040px);margin:0 auto;padding:calc(2rem + var(--safe-t)) 1rem calc(2.5rem + var(--safe-b));text-align:center}
.gtitle{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.3rem,10vw,3.6rem);color:var(--ivory);text-shadow:0 0 16px rgba(245,185,197,.4),0 2px 10px rgba(0,0,0,.7);line-height:1.1}
.gsub{font-size:clamp(.8rem,3vw,1rem);letter-spacing:.2em;text-transform:uppercase;color:var(--blush);margin:.2rem 0 1.2rem;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.tabs{display:flex;gap:.6rem;justify-content:center;margin-bottom:1.4rem}
.tab{background:rgba(59,7,16,.6);color:var(--ivory);border:1px solid var(--gold);min-height:44px;padding:.35rem 1.1rem;border-radius:999px;font-style:italic;font-size:1rem}
.tab[aria-selected="true"]{background:var(--rose);border-color:var(--rose)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1rem,2.5vw,1.8rem);justify-items:center}
@media (max-width:820px){.mgrid{grid-template-columns:repeat(2,1fr);gap:1rem}}
@media (max-width:520px){.mgrid{grid-template-columns:1fr;max-width:320px;margin:0 auto;gap:1.4rem}}
.mem{position:relative;width:100%;max-width:280px;background:linear-gradient(170deg,#fffaf0,#f6e8cf);border:0;padding:.7rem .7rem .95rem;border-radius:3px;box-shadow:0 10px 22px rgba(0,0,0,.4);color:#4a1420;text-align:left;transform:rotate(var(--tilt,0deg));transition:transform .3s ease}
.mem:nth-child(3n+2){--tilt:-1deg}.mem:nth-child(3n+3){--tilt:.9deg}.mem:nth-child(3n+1){--tilt:-.4deg}
.mem.active{outline:2px solid var(--gold);outline-offset:4px}
.mem .photo{width:100%;aspect-ratio:4/5;background:#f3d6dc;overflow:hidden;border-radius:2px;display:flex;align-items:center;justify-content:center}
.mem .photo img{width:100%;height:100%;object-fit:cover;display:block}
.mem .photo.fallback img{object-fit:contain;padding:12%}
.mem .mdate{display:block;margin-top:.6rem;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#8a4a58}
.mem .mtitle{display:block;font-family:"Great Vibes",cursive;font-size:clamp(1.6rem,6vw,1.9rem);line-height:1.1;margin-top:.1rem}
.mem .mcap{display:block;font-style:italic;font-size:clamp(.95rem,3.6vw,1rem);line-height:1.35;color:#5c2a36;margin-top:.2rem}
#gardenView.open .mem{animation:bloomIn .9s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0s)}
@keyframes bloomIn{from{opacity:0;transform:scale(.7) rotate(var(--tilt,0deg))}to{opacity:1;transform:scale(1) rotate(var(--tilt,0deg))}}
.timeline{display:none;position:relative;max-width:640px;margin:0 auto;text-align:left;padding-left:1.4rem}
.timeline::before{content:"";position:absolute;left:.4rem;top:.4rem;bottom:.4rem;width:2px;background:linear-gradient(var(--gold),var(--rose))}
.timeline.show{display:block}
.tl-item{position:relative;display:block;width:100%;min-height:44px;background:linear-gradient(170deg,#fffaf0,#f6e8cf);color:#4a1420;padding:.9rem 1rem;border-radius:3px;margin-bottom:1rem;box-shadow:0 8px 18px rgba(0,0,0,.35);border:0;text-align:left;font:inherit}
.tl-item::before{content:"";position:absolute;left:-1.4rem;top:1.2rem;width:12px;height:12px;border-radius:50%;background:var(--rose);transform:translateX(-4px);box-shadow:0 0 0 3px var(--ivory)}
.tl-item .tdate{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#8a4a58;display:block}
.tl-item .ttitle{display:block;font-family:"Great Vibes",cursive;font-size:clamp(1.5rem,6vw,1.7rem);line-height:1.1}
.tl-item .tcap{display:block;font-style:italic;color:#5c2a36}
#mGrid.hide{display:none}
.gback{margin-top:1.8rem}

/* Memory viewer */
#viewer{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(30,3,10,.8);opacity:0;transition:opacity .35s ease}
#viewer.show{display:flex}
#viewer.in{opacity:1}
.vcard{position:relative;background:linear-gradient(170deg,#fffaf0,#f4e3c4);color:#3e1220;width:min(94vw,640px);max-height:calc(100dvh - 1.2rem - var(--safe-t) - var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.1rem 1.1rem 1.4rem;border-radius:4px;box-shadow:0 24px 50px rgba(0,0,0,.6);transform:scale(.94);transition:transform .35s ease}
#viewer.in .vcard{transform:scale(1)}
.vimg{width:100%;aspect-ratio:4/3;max-height:52dvh;background:#f3d6dc;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vimg img{width:100%;height:100%;object-fit:contain}
.vimg.fallback img{padding:10%}
.vdate{margin-top:.8rem;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:#8a4a58;text-align:center}
.vtitle{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(1.9rem,8vw,2.7rem);text-align:center;line-height:1.1;margin:.2rem 0 .4rem}
.vcap{font-style:italic;font-size:clamp(1rem,4vw,1.15rem);text-align:center;color:#5c2a36;margin-bottom:.7rem}
.vtext{font-size:clamp(1rem,4vw,1.1rem);line-height:1.7;white-space:pre-wrap;overflow-wrap:break-word}
.vnav{display:flex;justify-content:space-between;align-items:center;margin-top:1.1rem;gap:.5rem}
.nav{background:var(--rose);color:#fff;border:0;min-height:44px;padding:.5rem 1rem;border-radius:999px;font-style:italic;font-size:1rem;white-space:nowrap}
.nav:disabled{opacity:.4}
.vcount{font-size:.9rem;color:#8a4a58;letter-spacing:.08em}
.mclose{position:absolute;top:.2rem;right:.2rem;width:44px;height:44px;background:none;border:0;font-size:2rem;color:#7a2a3a;z-index:2;display:flex;align-items:center;justify-content:center}

@media (max-width:600px){
  #heroInner{gap:.9rem;padding-top:1.5rem}
  .card{width:92vw;padding:1.2rem 1.2rem 1.5rem}
  .seal{width:38px;height:38px;font-size:1rem;right:12px;bottom:-12px}
  .btns{gap:.6rem}
  .btn{flex:1 1 auto;min-width:0;padding:.6rem 1rem}
  .overlay{padding:.5rem}
  .sheet{padding:1.9rem 1.2rem 1.4rem;width:96vw}
  .vcard{width:100vw;max-width:100vw;border-radius:0;padding:1rem .9rem 1.4rem}
  .vimg{max-height:40dvh}
  .vnav{position:sticky;bottom:0;background:linear-gradient(170deg,#fffaf0,#f4e3c4);padding:.6rem 0 .2rem}
  #musicBtn{font-size:.85rem;padding:.3rem .75rem}
}
@media (max-width:380px){
  .heading{font-size:clamp(2.1rem,11vw,3rem)}
  .btns{flex-direction:column;align-items:stretch;width:100%;max-width:280px;margin:0 auto}
  .btn{flex:none;width:100%}
}
@media (prefers-reduced-motion: reduce){
  .flower img,.flower,.petal,.gift,#hint,.mem,#gardenView.open .mem,.bp{animation:none !important}
  .rv{transition:none}
}
</style>
</head>
<body>

<div id="glow" class="layer"></div>
<div id="garden" class="layer"></div>
<div id="petals" class="layer"></div>

<section id="giftScene">
  <p id="giftGreet"></p>
  <button id="gift" class="gift" aria-label="Open your gift">
    <div class="lid"><div class="rib"></div></div>
    <div class="base"><div class="rib"></div></div>
    <div class="bow"><span></span><span></span></div>
  </button>
  <p id="hint">Tap the gift</p>
</section>

<section id="hero">
  <div id="heroInner">
    <p class="kicker rv" style="--d:0s" id="kicker"></p>
    <h1 class="heading rv" style="--d:.5s" id="heading"></h1>
    <div class="card rv" style="--d:1.1s">
      <p class="for" id="forLine"></p>
      <p class="msg" id="cardMsg"></p>
      <span class="seal">♥</span>
    </div>
    <p class="quote rv" style="--d:1.8s" id="quote"></p>
    <div class="btns rv" style="--d:2.2s">
      <button class="btn" id="btnLetter">Read my letter</button>
      <button class="btn ghost" id="btnGarden">Our garden</button>
      <button class="btn ghost" id="btnReplay">Replay</button>
    </div>
  </div>
</section>

<button id="musicBtn" hidden aria-pressed="false">Play music</button>
<audio id="bgm" loop preload="none"></audio>

<div id="letter" class="overlay" role="dialog" aria-modal="true" aria-labelledby="fromLine">
  <div class="sheet">
    <button class="close" id="closeLetter" aria-label="Close letter">×</button>
    <p class="from" id="fromLine"></p>
    <p class="to" id="toLine"></p>
    <div class="letter-text" id="letterBody"></div>
    <p class="from" id="letterDate" style="margin-top:1rem"></p>
  </div>
</div>

<div id="gardenView" class="overlay" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <div class="gbox">
    <h2 class="gtitle" id="gTitle">Our memories</h2>
    <p class="gsub" id="gSub"></p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabGallery" aria-selected="true" aria-controls="mGrid">Gallery</button>
      <button class="tab" role="tab" id="tabTimeline" aria-selected="false" aria-controls="tlView">Timeline</button>
    </div>
    <div class="mgrid" id="mGrid"></div>
    <div class="timeline" id="tlView"></div>
    <button class="btn ghost gback" id="gBack">← Back to greeting</button>
  </div>
</div>

<div id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="vcard" id="vcard">
    <button class="mclose" id="vClose" aria-label="Close memory">×</button>
    <div class="vimg" id="vImg"></div>
    <p class="vdate" id="vDate"></p>
    <h3 class="vtitle" id="vTitle"></h3>
    <p class="vcap" id="vCap"></p>
    <p class="vtext" id="vText"></p>
    <div class="vnav">
      <button class="nav" id="vPrev">← Previous</button>
      <span class="vcount" id="vCount"></span>
      <button class="nav" id="vNext">Next →</button>
    </div>
  </div>
</div>

<script>
// ===== EDIT YOUR PERSONAL CONTENT HERE =====
const CONFIG = {
  myName: "[MY NAME]",
  herName: "[HER NAME]",
  monthsaryDate: "[OUR MONTHSARY DATE]",
  monthsCount: "[NUMBER] months",
  giftGreeting: "For my favorite person...",
  greeting: "My Favorite Person",
  cardMessage: "[A short personal message about why she is special to you.]",
  quote: "Every day with you is another flower in our little garden.",
  letter: [
    "[Paragraph 1: how you feel about her and this month together.]",
    "[Paragraph 2: a favorite memory you share.]",
    "[Paragraph 3: what you look forward to.]"
  ],
  // photo: "memories/1.jpg" or "" for a flower. date: "YYYY-MM-DD" for the timeline.
  memories: [
    { photo: "", date: "[YYYY-MM-DD]", title: "[Memory 1 title]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "", date: "[YYYY-MM-DD]", title: "[Memory 2 title]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "", date: "[YYYY-MM-DD]", title: "[Memory 3 title]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "", date: "[YYYY-MM-DD]", title: "[Memory 4 title]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "", date: "[YYYY-MM-DD]", title: "[Memory 5 title]", caption: "[Short caption]", text: "[Full story]" },
    { photo: "", date: "[YYYY-MM-DD]", title: "[Memory 6 title]", caption: "[Short caption]", text: "[Full story]" }
  ],
  music: "music/song.mp3"   // set to "" to hide the music button
};

// Repaired transparent flowers from assets/flowers (created by fix_flowers.py)
const FLOWER_FILES = [
  "assets/flowers/flower1.png", "assets/flowers/flower2.png", "assets/flowers/flower3.png",
  "assets/flowers/flower4.png", "assets/flowers/flower5.png", "assets/flowers/flower6.png"
];

// ===== Helpers =====
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isPhone = () => innerWidth <= 600;
const garden = $('garden'), petalBox = $('petals');
let sprites = [], timers = [], revealed = false, opened = false, typeTimer = null;
let current = 0, viewerOpen = false, lastFocus = null, layerOpen = false, rt = null;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = () => sprites[(Math.random() * sprites.length) | 0];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

// ===== Fill text from CONFIG =====
$('giftGreet').textContent = CONFIG.giftGreeting;
$('kicker').textContent = CONFIG.monthsaryDate + " · " + CONFIG.monthsCount;
$('heading').textContent = CONFIG.greeting;
$('forLine').textContent = "For " + CONFIG.herName;
$('cardMsg').textContent = CONFIG.cardMessage;
$('quote').textContent = CONFIG.quote;
$('fromLine').textContent = "From: " + CONFIG.myName;
$('toLine').textContent = "To: " + CONFIG.herName;
$('letterDate').textContent = "Date: " + CONFIG.monthsaryDate;
$('gSub').textContent = CONFIG.monthsCount + " together";

// ===== Load the repaired flower images (no browser-side cleaning) =====
function loadImage(src) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(src);
    i.onerror = () => res(null);
    i.src = src;
  });
}
function petalURL(color) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  x.translate(32, 32);
  for (let i = 0; i < 5; i++) {
    x.rotate(Math.PI * 2 / 5);
    x.beginPath();
    x.ellipse(0, -16, 10, 16, 0, 0, Math.PI * 2);
    x.fillStyle = color;
    x.fill();
  }
  return c.toDataURL('image/png');
}
async function getSprites() {
  const ok = (await Promise.all(FLOWER_FILES.map(loadImage))).filter(Boolean);
  if (!ok.length) return [petalURL('#e8557a'), petalURL('#ff8fab'), petalURL('#f5c2cf')];
  return ok;
}

// ===== Flower frame: real cutouts around the outside, center kept open =====
function build(intro) {
  garden.innerHTML = '';
  const W = innerWidth, H = innerHeight, phone = isPhone();
  const cx = W / 2, cy = H / 2;
  const rx = (phone ? 0.46 : 0.34) * W;
  const ry = (phone ? 0.36 : 0.40) * H;
  const inOpen = (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1;
  const cell = phone ? Math.max(95, Math.min(W, H) / 4.2) : Math.max(100, Math.min(W, H) / 5.2);
  const cols = Math.ceil(W / cell) + 2, rows = Math.ceil(H / cell) + 2;
  const items = [];
  for (let r = -1; r < rows - 1; r++) {
    for (let c = -1; c < cols - 1; c++) {
      const ox = (c + .5) * cell + rand(-.3, .3) * cell;
      const oy = (r + .5) * cell + rand(-.3, .3) * cell;
      if (!inOpen(ox, oy)) items.push({ ox, oy, size: cell * rand(.95, 1.2), layer: 2 });
      const ox2 = ox + rand(-.12, .12) * cell, oy2 = oy + rand(-.12, .12) * cell;
      if (!inOpen(ox2, oy2) && Math.random() < (phone ? .2 : .35)) {
        items.push({ ox: ox2, oy: oy2, size: cell * rand(1.2, 1.45), layer: 3 });
      }
    }
  }
  // A few flowers drift slowly through the frame. Fewer on phones.
  const driftCount = phone ? 3 : 6;
  const driftIdx = new Set();
  while (driftIdx.size < Math.min(driftCount, items.length)) driftIdx.add((Math.random() * items.length) | 0);

  items.forEach((it, idx) => {
    const dx = it.ox - cx, dy = it.oy - cy;
    const dist = Math.hypot(dx / W, dy / H);
    const w = document.createElement('div');
    w.className = 'flower';
    w.style.cssText = `left:${it.ox - it.size / 2}px;top:${it.oy - it.size / 2}px;width:${it.size}px;height:${it.size}px;z-index:${it.layer}`;
    const img = document.createElement('img');
    img.src = pick(); img.alt = ''; img.draggable = false; img.decoding = 'async';
    if (Math.random() < 0.33) {
      img.className = 'sway';
      img.style.setProperty('--rot', rand(-25, 25).toFixed(1) + 'deg');
      img.style.setProperty('--dur', rand(7, 11).toFixed(2) + 's');
      img.style.setProperty('--delay', (-rand(0, 10)).toFixed(2) + 's');
    }
    if (driftIdx.has(idx)) {
      w.classList.add('drift');
      w.style.setProperty('--dx', rand(-40, 40).toFixed(0) + 'px');
      w.style.setProperty('--dy', rand(-36, 36).toFixed(0) + 'px');
      w.style.setProperty('--ddur', rand(26, 40).toFixed(1) + 's');
      w.style.setProperty('--ddelay', (-rand(0, 30)).toFixed(1) + 's');
    }
    w.appendChild(img);
    garden.appendChild(w);
    if (intro && !reduced) {
      w.animate([
        { transform: `translate(${dx * 1.3}px,${dy * 1.3}px) scale(.25) rotate(${rand(-180, 180)}deg)`, opacity: 0 },
        { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 }
      ], { duration: rand(1100, 1700), delay: (1 - Math.min(1, dist * 1.4)) * 1500 + rand(0, 600),
           easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    }
  });
}

function makePetals() {
  petalBox.innerHTML = '';
  if (reduced) return;
  const n = isPhone() ? 5 : 9;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('img');
    p.className = 'petal'; p.src = pick(); p.alt = '';
    p.style.width = rand(18, 30) + 'px';
    p.style.left = rand(-5, 95) + 'vw';
    p.style.animationDuration = rand(12, 20).toFixed(2) + 's';
    p.style.animationDelay = (-rand(0, 20)).toFixed(2) + 's';
    petalBox.appendChild(p);
  }
}

// ===== Petal burst from a point =====
function burst(x, y, count = 10) {
  if (reduced || count <= 0) return;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('img');
    p.className = 'bp'; p.src = pick(); p.alt = '';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    petalBox.appendChild(p);
    const a = rand(0, Math.PI * 2), d = rand(60, 180);
    const anim = p.animate([
      { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px),calc(-50% + ${Math.sin(a) * d + 40}px)) scale(.9) rotate(${rand(-240, 240)}deg)`, opacity: 0 }
    ], { duration: rand(1400, 2200), easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    anim.onfinish = () => p.remove();
  }
}
document.addEventListener('pointerdown', e => {
  if (!revealed) return;
  if (e.target.closest('button,a,audio,.sheet,.gbox,.card,#musicBtn,#viewer,#gardenView')) return;
  burst(e.clientX, e.clientY, isPhone() ? 5 : 8);
});

// ===== Gift opening =====
function reveal() {
  revealed = true;
  document.body.classList.remove('bursting');
  document.body.classList.add('revealed');
}
function openGift() {
  if (!sprites.length || opened) return;
  opened = true;
  $('gift').classList.add('open');
  $('hint').style.display = 'none';
  document.body.classList.add('bursting');
  later(() => { build(true); makePetals(); }, reduced ? 0 : 900);
  later(() => $('giftScene').classList.add('gone'), reduced ? 0 : 1500);
  later(reveal, reduced ? 0 : 3600);
}
$('gift').addEventListener('click', openGift);

// ===== Scroll lock and back button =====
function lockScroll() { document.body.style.overflow = 'hidden'; }
function unlockScroll() { document.body.style.overflow = ''; }
function openLayer() {
  if (!layerOpen) { layerOpen = true; history.pushState({ layer: true }, ''); }
}
window.addEventListener('popstate', () => {
  if (viewerOpen) { closeViewer(); layerOpen = false; return; }
  if (layerOpen) closeAll(true);
});

function closeAll(fromBack) {
  closeViewer();
  $('letter').classList.remove('show');
  const g = $('gardenView');
  g.classList.remove('show', 'open');
  clearInterval(typeTimer);
  unlockScroll();
  if (layerOpen && !fromBack && history.state && history.state.layer) history.back();
  layerOpen = false;
}
function replay() {
  clearTimers();
  closeAll();
  opened = false; revealed = false;
  document.body.classList.remove('revealed', 'bursting');
  garden.innerHTML = '';
  petalBox.innerHTML = '';
  $('giftScene').classList.remove('gone');
  $('gift').classList.remove('open');
  $('hint').style.display = '';
}
$('btnReplay').addEventListener('click', replay);

// ===== Gallery and timeline =====
const sortedMemories = () => CONFIG.memories
  .map((m, i) => ({ ...m, _i: i }))
  .sort((a, b) => (a.date || '').localeCompare(b.date || ''));

function buildMemories() {
  const grid = $('mGrid');
  grid.innerHTML = '';
  CONFIG.memories.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'mem';
    b.type = 'button';
    b.dataset.i = i;
    b.setAttribute('aria-label', 'Open memory: ' + m.title);
    b.style.setProperty('--d', (i * 0.12) + 's');
    const photo = document.createElement('div');
    photo.className = 'photo';
    const img = document.createElement('img');
    img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
    if (m.photo) img.src = m.photo;
    else { photo.classList.add('fallback'); img.src = sprites[i % sprites.length]; }
    photo.appendChild(img);
    const d = document.createElement('span'); d.className = 'mdate'; d.textContent = m.date || '';
    const t = document.createElement('span'); t.className = 'mtitle'; t.textContent = m.title;
    const c = document.createElement('span'); c.className = 'mcap'; c.textContent = m.caption || '';
    b.append(photo, d, t, c);
    grid.appendChild(b);
  });
}
function buildTimeline() {
  const tl = $('tlView');
  tl.innerHTML = '';
  sortedMemories().forEach(m => {
    const b = document.createElement('button');
    b.className = 'tl-item';
    b.type = 'button';
    b.dataset.i = m._i;
    const d = document.createElement('span'); d.className = 'tdate'; d.textContent = m.date || '';
    const t = document.createElement('span'); t.className = 'ttitle'; t.textContent = m.title;
    const c = document.createElement('span'); c.className = 'tcap'; c.textContent = m.caption || '';
    b.append(d, t, c);
    tl.appendChild(b);
  });
}
function setTab(which) {
  const gal = which === 'gallery';
  $('tabGallery').setAttribute('aria-selected', gal);
  $('tabTimeline').setAttribute('aria-selected', !gal);
  $('mGrid').classList.toggle('hide', !gal);
  $('tlView').classList.toggle('show', !gal);
}
$('tabGallery').addEventListener('click', () => setTab('gallery'));
$('tabTimeline').addEventListener('click', () => setTab('timeline'));

function openGallery() {
  const g = $('gardenView');
  g.classList.remove('open');
  g.classList.add('show');
  setTab('gallery');
  requestAnimationFrame(() => g.classList.add('open'));
  lockScroll();
  openLayer();
  $('gBack').focus({ preventScroll: true });
}
$('btnGarden').addEventListener('click', openGallery);
$('gBack').addEventListener('click', () => closeAll());
$('gardenView').addEventListener('click', e => {
  if (e.target.id === 'gardenView') { closeAll(); return; }
  const card = e.target.closest('.mem, .tl-item');
  if (!card) return;
  const rect = card.getBoundingClientRect();
  openViewer(parseInt(card.dataset.i, 10), rect.left + rect.width / 2, rect.top + rect.height / 2, card);
});

// ===== Memory viewer =====
function fillViewer(i) {
  const m = CONFIG.memories[i];
  const box = $('vImg');
  box.innerHTML = '';
  box.classList.toggle('fallback', !m.photo);
  const img = document.createElement('img');
  img.alt = m.title; img.decoding = 'async';
  img.src = m.photo || sprites[i % sprites.length];
  box.appendChild(img);
  $('vDate').textContent = m.date || '';
  $('vTitle').textContent = m.title;
  $('vCap').textContent = m.caption || '';
  $('vText').textContent = m.text || '';
  $('vCount').textContent = (i + 1) + ' / ' + CONFIG.memories.length;
  $('vPrev').disabled = i === 0;
  $('vNext').disabled = i === CONFIG.memories.length - 1;
  $('vcard').scrollTop = 0;
  current = i;
  document.querySelectorAll('.mem').forEach(el => el.classList.toggle('active', +el.dataset.i === i));
}
function openViewer(i, x, y, fromEl) {
  lastFocus = fromEl || document.activeElement;
  fillViewer(i);
  const v = $('viewer');
  v.classList.add('show');
  viewerOpen = true;
  requestAnimationFrame(() => v.classList.add('in'));
  lockScroll();
  openLayer();
  burst(x, y, reduced ? 0 : (isPhone() ? 4 : 7));
  $('vClose').focus({ preventScroll: true });
}
function closeViewer() {
  if (!viewerOpen) return;
  const v = $('viewer');
  v.classList.remove('in');
  viewerOpen = false;
  setTimeout(() => { if (!viewerOpen) v.classList.remove('show'); }, 350);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
function step(delta) {
  const next = current + delta;
  if (next < 0 || next >= CONFIG.memories.length) return;
  fillViewer(next);
}
$('vPrev').addEventListener('click', () => step(-1));
$('vNext').addEventListener('click', () => step(1));
$('vClose').addEventListener('click', closeViewer);
$('viewer').addEventListener('click', e => { if (e.target.id === 'viewer') closeViewer(); });
let touchX = null;
$('viewer').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
$('viewer').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
});
document.addEventListener('keydown', e => {
  if (viewerOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    return;
  }
  if (e.key === 'Escape') closeAll();
});

// ===== Letter with typewriter effect =====
function typeText(el, text) {
  clearInterval(typeTimer);
  el.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) clearInterval(typeTimer);
  }, 28);
}
function closeLetter() {
  $('letter').classList.remove('show');
  clearInterval(typeTimer);
  unlockScroll();
}
$('btnLetter').addEventListener('click', () => {
  $('letter').classList.add('show');
  lockScroll();
  openLayer();
  $('letter').querySelector('.sheet').scrollTop = 0;
  typeText($('letterBody'), CONFIG.letter.join("\n\n"));
});
$('closeLetter').addEventListener('click', closeLetter);
$('letter').addEventListener('click', e => { if (e.target.id === 'letter') closeLetter(); });

// ===== Music (optional, starts only when chosen) =====
const bgm = $('bgm'), musicBtn = $('musicBtn');
if (CONFIG.music) {
  bgm.src = CONFIG.music;
  musicBtn.hidden = false;
  bgm.addEventListener('error', () => { musicBtn.hidden = true; });
  musicBtn.addEventListener('click', () => {
    if (bgm.paused) {
      bgm.play().then(() => {
        musicBtn.textContent = 'Pause music';
        musicBtn.setAttribute('aria-pressed', 'true');
      }).catch(() => { musicBtn.textContent = 'Music unavailable'; });
    } else {
      bgm.pause();
      musicBtn.textContent = 'Play music';
      musicBtn.setAttribute('aria-pressed', 'false');
    }
  });
}

// ===== Boot =====
getSprites().then(s => {
  sprites = s;
  buildMemories();
  buildTimeline();
  document.body.classList.add('ready');
});
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (revealed) build(false); }, 300);
});
</script>
