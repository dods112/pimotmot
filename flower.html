<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowers for you ♥</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#0b0814, #1b1030 60%, #2a1830);
    overflow: hidden; font-family: Georgia, serif; color: #ffe6ee;
  }
  .back {
    position: fixed; top: 1rem; left: 1rem; z-index: 100; color: #fff;
    text-decoration: none; font-style: italic; background: rgba(0,0,0,.4);
    padding: .4rem .9rem; border-radius: 999px;
  }
  h1 {
    position: absolute; top: 7vh; width: 100%; text-align: center;
    font-style: italic; font-weight: normal; font-size: clamp(1.8rem, 5vw, 3rem); color: #ffd6e0;
  }
  #who {
    position: absolute; top: 15vh; width: 100%; text-align: center;
    font-size: clamp(1.4rem, 4vw, 2.2rem); color: #fff; text-shadow: 0 0 12px #ff8fab;
    opacity: 0; transition: opacity 1.5s;
  }
  #msg {
    position: absolute; top: 22vh; width: 100%; text-align: center; font-style: italic;
    padding: 0 1rem; opacity: 0; transition: opacity 1.5s;
  }
  .show { opacity: 1 !important; }

  .ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 22vh;
    background: linear-gradient(#0f3d2a, #06200f);
  }
  .light {
    position: absolute; bottom: 20vh; width: 6px; height: 6px; border-radius: 50%;
    background: #23f0ff; box-shadow: 0 0 8px #23f0ff;
    animation: rise 4s linear infinite; opacity: 0;
  }
  .light:nth-child(odd) { background: #fffb00; box-shadow: 0 0 8px #fffb00; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-40vh); }
  }

  svg {
    position: absolute; left: 50%; bottom: 18vh; transform: translateX(-50%);
    width: min(60vw, 260px); height: auto; overflow: visible;
  }
  .stem {
    fill: none; stroke: #7fbf7a; stroke-width: 5; stroke-linecap: round;
    stroke-dasharray: 300; stroke-dashoffset: 300;
    animation: grow 3s ease-out forwards;
  }
  @keyframes grow { to { stroke-dashoffset: 0; } }
  .leaf {
    fill: #5fa15a; transform-box: fill-box; transform-origin: center;
    transform: scale(0); animation: pop 1s ease-out forwards;
  }
  .petal {
    fill: #e8557a; transform-box: fill-box; transform-origin: center;
    transform: scale(0); animation: pop 1.1s cubic-bezier(.2,.8,.3,1.2) forwards;
  }
  .center {
    fill: #ffd166; transform-box: fill-box; transform-origin: center;
    transform: scale(0); animation: pop .6s ease-out forwards;
  }
  @keyframes pop { to { transform: scale(1); } }
  .l1 { animation-delay: 2s; } .l2 { animation-delay: 2.3s; }
  .p1 { animation-delay: 3s; } .p2 { animation-delay: 3.2s; } .p3 { animation-delay: 3.4s; }
  .p4 { animation-delay: 3.6s; } .p5 { animation-delay: 3.8s; }
  .center { animation-delay: 4.2s; }

  #renew {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 200;
    display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center;
    background: rgba(0,0,0,.45); padding: .6rem; border-radius: 14px;
  }
  #renew input { font: inherit; padding: .45rem .7rem; border-radius: 8px; border: none; min-width: 140px; }
  #renew button {
    font: inherit; font-style: italic; padding: .45rem 1rem; border-radius: 999px;
    border: none; background: #e8557a; color: #fff; cursor: pointer;
  }
</style>
</head>
<body>

<a class="back" href="index.html">← back</a>

<h1>Flowers for you</h1>
<div id="who"></div>
<div id="msg"></div>

<div class="ground"></div>

<svg viewBox="0 0 200 300" aria-hidden="true">
  <path class="stem" d="M100 290 C 96 230, 106 170, 100 120" />
  <path class="leaf l1" d="M100 230 Q 62 220 56 186 Q 88 196 100 224 Z" />
  <path class="leaf l2" d="M100 200 Q 140 190 148 156 Q 116 166 100 194 Z" />
  <ellipse class="petal p1" cx="100" cy="72" rx="24" ry="36" />
  <ellipse class="petal p2" cx="132" cy="94" rx="24" ry="36" />
  <ellipse class="petal p3" cx="120" cy="134" rx="24" ry="36" />
  <ellipse class="petal p4" cx="80" cy="134" rx="24" ry="36" />
  <ellipse class="petal p5" cx="68" cy="94" rx="24" ry="36" />
  <circle class="center" cx="100" cy="104" r="15" />
</svg>

<form id="renew">
  <input id="inName" placeholder="Her name" maxlength="30">
  <input id="inMsg" placeholder="Your message" maxlength="120">
  <button type="submit">Renew the flower ♥</button>
</form>

<script>
  const q = new URLSearchParams(location.search);
  const name = q.get('name');
  const message = q.get('message');

  if (name) {
    const who = document.getElementById('who');
    who.textContent = name;
    setTimeout(() => who.classList.add('show'), 1500);
  }
  if (message) {
    const msg = document.getElementById('msg');
    msg.textContent = message;
    setTimeout(() => msg.classList.add('show'), 2000);
  }

  // Glowing lights rising from the grass
  for (let i = 0; i < 24; i++) {
    const l = document.createElement('div');
    l.className = 'light';
    l.style.left = (5 + Math.random() * 90) + '%';
    l.style.animationDelay = (Math.random() * 4) + 's';
    document.body.appendChild(l);
  }

  // Renew the flower with new name and message
  document.getElementById('renew').addEventListener('submit', e => {
    e.preventDefault();
    const p = new URLSearchParams();
    const n = document.getElementById('inName').value.trim();
    const m = document.getElementById('inMsg').value.trim();
    if (n) p.set('name', n);
    if (m) p.set('message', m);
    location.search = p.toString();
  });
</script>
</body>
</html>
